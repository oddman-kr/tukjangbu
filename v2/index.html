      S.data.tx = S.data.tx.filter(function(x){ return x.id !== e.id; });
      queue({ op: 'delete', id: e.id }); haptic(); closeSheet(); render();
      toast('삭제했어요', '실행 취소', function(){ if (!gone) return; S.data.tx.push(gone); queue({ op: 'add', items: [gone] }); render(); toast('삭제를 취소했어요'); });
    };
  }
  function pull(){

function statsHTML(){
  var list = txOfMonth(S.month);
  var exp = list.filter(function(t){ return t.type === '지출'; });
  var byCat = {}; exp.forEach(function(t){ var k = masked(t) ? '개인 용돈(숨김)' : t.category; byCat[k] = (byCat[k] || 0) + t.amount; });
  var rows = cats('지출').map(function(c){ return { name: c.name, budget: isKid() ? 0 : c.budget, spent: byCat[c.name] || 0 }; });
  Object.keys(byCat).forEach(function(k){ if (!rows.some(function(r){ return r.name === k; })) rows.push({ name: k, budget: 0, spent: byCat[k] }); });
  rows = rows.filter(function(r){ return r.spent || r.budget; }).sort(function(a, b){ return b.spent - a.spent; });
  var total = sumBy(list, '지출');
  var catHTML = rows.map(function(r){
    var pct = r.budget ? r.spent / r.budget : 0, cls = pct >= 1 ? 'bad' : pct >= 0.85 ? 'warn' : '';
    var share = total ? Math.round(r.spent / total * 100) : 0;
    return '<div class="cat"><div class="row between"><span>' + icon(r.name) + ' ' + esc(r.name) + (pct >= 1 ? '<span class="badge">초과</span>' : '') + '</span><span class="num"><b>' + won(r.spent) + '</b>' + (r.budget ? '<span class="faint xs"> / ' + won(r.budget) + '</span>' : '') + '</span></div>' +
      (r.budget ? '<div class="bar"><i class="' + cls + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i></div>' : '<div class="faint xs">예산 없음 · 지출의 ' + share + '%</div>') + '</div>';
  }).join('');
  // 6개월 추이
  var ms = []; for (var k = 5; k >= 0; k--) ms.push(shiftMonth(S.month, -k));
  var vals = ms.map(function(m){ return sumBy(txOfMonth(m), '지출'); });
  var max = Math.max.apply(null, vals.concat([1]));
  var trend = '<div class="trend">' + ms.map(function(m, i){ return '<div class="col"><div class="v">' + (vals[i] ? Math.round(vals[i] / 10000) + '만' : '') + '</div><div class="b' + (m === S.month ? ' cur' : '') + '" style="height:' + (vals[i] / max * 110).toFixed(0) + 'px"></div><div class="l">' + (+m.slice(5)) + '월</div></div>'; }).join('') + '</div>';
  var avg = vals.slice(0, 5).filter(Boolean);
  avg = avg.length ? avg.reduce(function(a, b){ return a + b; }, 0) / avg.length : 0;
  function split(key, only){ var o = {}; exp.forEach(function(t){ if (only && !only(t)) return; var kk = key === 'scope' ? (t.scope === '개인' ? '개인 용돈' : '가족 공용') : (t[key] || '미지정'); o[kk] = (o[kk] || 0) + t.amount; }); return Object.keys(o).sort(function(a, b){ return o[b] - o[a]; }).map(function(kk){ return '<div class="row between" style="padding:6px 0"><span>' + (key === 'who' && members().indexOf(kk) >= 0 ? avatar(kk, 22) + ' ' : '') + (key === 'method' && kk !== '미지정' ? payDot(kk, 10) : '') + esc(kk) + '</span><span class="num"><b>' + won(o[kk]) + '</b><span class="faint xs"> ' + (total ? Math.round(o[kk] / total * 100) : 0) + '%</span></span></div>'; }).join('') || '<div class="faint sm">내역 없음</div>'; }
  // 주간: 최근 8주 (월요일 시작)
  var mon = new Date(); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  var wk = []; for (var w = 7; w >= 0; w--) { var a = new Date(mon.getTime() - w * 7 * 864e5), z = new Date(a.getTime() + 6 * 864e5); wk.push({ from: ymd(a), to: ymd(z), label: (a.getMonth() + 1) + '/' + a.getDate() }); }
  wk.forEach(function(x){ x.v = visTx().filter(function(t){ return t.type === '지출' && t.date >= x.from && t.date <= x.to; }).reduce(function(s2, t){ return s2 + t.amount; }, 0); });
  var wmax = Math.max.apply(null, wk.map(function(x){ return x.v; }).concat([1]));
  var wprev = wk.slice(0, 7).map(function(x){ return x.v; }).filter(Boolean), wavg = wprev.length ? wprev.reduce(function(a, b){ return a + b; }, 0) / wprev.length : 0;
  var weekly = '<div class="card"><h3>주간 지출 <span class="faint xs" style="font-weight:400">최근 8주 · 월요일 시작</span></h3><div class="trend">' + wk.map(function(x, i){ return '<div class="col"><div class="v">' + (x.v ? Math.round(x.v / 10000) + '만' : '') + '</div><div class="b' + (i === 7 ? ' cur' : '') + '" style="height:' + (x.v / wmax * 110).toFixed(0) + 'px"></div><div class="l">' + (i === 7 ? '이번주' : x.label) + '</div></div>'; }).join('') + '</div>' +
    (wavg ? '<div class="faint sm" style="margin-top:8px">지난 주들 평균 ' + won(wavg) + '원 · 이번 주는 지금까지 <b>' + won(wk[7].v) + '원</b></div>' : '') + '</div>';

function isNeed(w){ return w.need === true || (w.need == null && (w.kind === '생필품' || w.kind === '식재료')); }
function kids(){ return S.data && S.data.cfg.kids ? S.data.cfg.kids : []; }
function isKid(){ return kids().indexOf(S.me) >= 0; }

function monthMoney(){
  var m = curM(), list = txOfMonth(m);
  var sav = sumBy(list, '저축');
  var side = list.filter(function(t){ return t.type === '수입' && !/급여|월급/.test(t.category); }).reduce(function(s, t){ return s + t.amount; }, 0);
  var spent = {}; list.forEach(function(t){ if (t.type === '지출') spent[t.category] = (spent[t.category] || 0) + t.amount; });
  var flex = cats('지출').filter(function(c){ return !isFixed(c) && c.budget > 0; }).map(function(c){ var sp = spent[c.name] || 0; return { name: c.name, budget: c.budget, spent: sp, left: c.budget - sp }; });
  var bud = flex.reduce(function(a, c){ return a + c.budget; }, 0);
  var left = flex.reduce(function(a, c){ return a + Math.max(0, c.left); }, 0);
  return { sav: sav, side: side, left: left, bud: bud, flex: flex };
}
function wishProgress(w, mm){
  mm = mm || monthMoney();
  if (w.cond === '저축') return { cur: mm.sav, target: w.target, label: '이번 달 저축' };
  if (w.cond === '부수입') return { cur: mm.side, target: w.target, label: '이번 달 부수입' };
  if (w.cond === '남은예산') return { cur: Math.max(0, mm.left), target: w.price, label: '이번 달 남은 생활 예산' };
  return null;
}
function wishMet(w, mm){ if (w.status !== '원함' && w.status !== '승인') return false; if (isNeed(w)) return false; var p = wishProgress(w, mm); return !!(p && p.target > 0 && p.cur >= p.target); }

function exportCSV(list, name){
  if (!list || !list.length) return toast('내보낼 내역이 없어요.');
  var q = function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['날짜', '구분', '카테고리', '금액', '내용', '결제수단', '입력자', '공용/개인', '메모']].concat(list.slice().sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).map(function(t){ var h = masked(t); return [t.date, t.type, h ? '개인 용돈' : t.category, t.amount, h ? '(숨김)' : t.desc, h ? '' : t.method, t.who, t.scope === '개인' ? '개인' : '공용', h ? '' : t.memo]; }));
  var csv = rows.map(function(r){ return r.map(q).join(','); }).join('\r\n');
  if (window.NativeApp && NativeApp.share) { NativeApp.share(name, 'text/csv', csv); return; }
  try {
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(list.length + '건을 파일로 저장했어요');
  } catch (e) { toast('이 브라우저에서는 내보내기를 할 수 없어요.'); }
}

  var last = LS.get('updCheckedAt', 0);
  if (!manual && Date.now() - last < 12 * 3600e3) return;
  LS.set('updCheckedAt', Date.now());
  fetch('https://api.github.com/repos/zkskslsk-del/gagyebu/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
    .then(function(r){ return r.json(); })
    .then(function(rel){
      var v = Number(String(rel.tag_name || '').replace(/\D/g, '')) || 0;
      var asset = (rel.assets || []).filter(function(a){ return /\.apk$/.test(a.name); })[0];
      if (v && asset) LS.set('update', { v: v, url: asset.browser_download_url });
      if (manual) toast(v > appVersion() ? '새 버전(' + v + ')이 있어요. 입력 화면 위쪽에서 설치할 수 있어요.' : '최신 버전이에요.');
      if (S.view === 'home' && !S.draft && !V.rec) render();
    }).catch(function(){ if (manual) toast('업데이트를 확인하지 못했어요. 인터넷을 확인해 주세요.'); });
}

/* ---------- 앱 잠금 ---------- */
window.__app = {
  authResult: function(ok, reason){
    LS.del('authPending');
    if (ok) return unlock();
    if (reason === 'no-lock') { LS.set('appLock', false); unlock(); return toast('휴대폰 화면 잠금이 꺼져 있어서 앱 잠금을 껐어요.'); }
    $('#unlockBtn').textContent = '다시 시도';
    $('#lockMsg').textContent = '확인이 취소됐어요. 다시 시도하거나 가족 비밀번호로 열어 주세요.';
  },
  toast: function(m){ toast(m); }
};
function lockOn(){ return !!(window.NativeApp && NativeApp.canLock && LS.get('appLock', false)); }
function bioOK(){ return appVersion() >= 6; } // 5 이하 앱은 지문 권한이 빠져 있어 비밀번호로만 열기
function askBio(){
  if (!bioOK()) return;
  LS.set('authPending', Date.now());
  try { NativeApp.authenticate(); } catch (e) { LS.del('authPending'); $('#lockMsg').textContent = '지문 확인을 시작하지 못했어요. 비밀번호로 열어 주세요.'; }
}
function lock(){
  if (!lockOn()) return false;
  S.locked = true; $('#lock').classList.remove('hidden');
  $('#lockMsg').textContent = ''; $('#lockPin').value = '';
  $('#unlockBtn').style.display = bioOK() ? '' : 'none';
  if (!bioOK()) { $('#lockMsg').textContent = '앱을 최신 버전으로 업데이트하면 지문으로 열 수 있어요.'; return true; }
  if (LS.get('authPending', 0)) { LS.del('authPending'); $('#lockMsg').textContent = '지난번 지문 확인이 끝나지 않았어요. 버튼을 눌러 다시 시도하거나 비밀번호로 열어 주세요.'; return true; }
  setTimeout(function(){ if (S.locked && document.visibilityState === 'visible') askBio(); }, 500);
  return true;
}
function unlock(){
  S.locked = false; $('#lock').classList.add('hidden'); $('#unlockBtn').textContent = '지문·얼굴로 열기';
  if (S.afterUnlock) { var f = S.afterUnlock; S.afterUnlock = null; f(); }
}
$('#unlockBtn').onclick = function(){ askBio(); };
$('#lockPinGo').onclick = function(){
  var v = $('#lockPin').value.trim();
  if (v && v === String(S.pin)) { unlock(); toast('비밀번호로 열었어요. 지문 잠금이 계속 안 되면 설정에서 앱 잠금을 꺼 주세요.', null, null, 4500); }
  else { $('#lockMsg').textContent = '가족 비밀번호가 맞지 않아요.'; $('#lockPin').value = ''; }
};
$('#lockPin').onkeydown = function(e){ if (e.key === 'Enter') $('#lockPinGo').click(); };
$('#lockPin').oninput = function(){ if (this.value.length === String(S.pin).length) $('#lockPinGo').click(); };

/* ---------- 뒤로가기 (안드로이드) ---------- */
window.__onBack = function(){
  if (S.locked) return false;
  if ($('#sheetBg').classList.contains('on')) { closeSheet(); return true; }
  if (V.rec) { try { V.rec.abort(); } catch (e) {} return true; }
  if (S.autoTimer) { cancelAuto(); return true; }
  if (S.view === 'list' && S.selDay) { S.selDay = ''; render(); return true; }
  if (S.view !== 'home') { S.view = 'home'; S.month = curM(); render(); window.scrollTo(0, 0); return true; }
  return false;
};
$('#sync').onclick = function(){ if (S.pin) { setSync('wait', '불러오는 중'); flush().then(function(){ return load(); }); } };
$('#sync').setAttribute('role', 'button'); $('#sync').setAttribute('aria-label', '새로고침');

/* ---------- 시작 ---------- */
document.querySelectorAll('.nav button').forEach(function(b){ b.onclick = function(){ S.view = b.dataset.v; if (S.view !== 'list') S.month = S.view === 'stats' ? S.month : curM(); render(); window.scrollTo(0, 0); }; });
var hiddenAt = 0;
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); if (V.rec) { try{ V.rec.abort(); }catch(e){} } return; }
  if (!S.pin) return;
  var away = hiddenAt && Date.now() - hiddenAt > 20000;
  if (hiddenAt && Date.now() - hiddenAt > 60000) lock();
  syncStatusBar();
  if (away && S.data && !S.draft && !$('#sheetBg').classList.contains('on')) { S.view = 'home'; render(); maybeAutoListen(false); }
  flush().then(function(){ return load(true); });
});
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
setInterval(function(){ if (document.visibilityState === 'visible' && S.pin && !$('#sheetBg').classList.contains('on') && !(S.view === 'home' && (S.draft || V.rec || S.autoTimer)) && S.view !== 'settings') { flush().then(function(){ return load(true); }); } }, 60000);

syncStatusBar();
if (window.BACKEND) S.pin = window.BACKEND.loggedIn() ? 'sb' : '';
if (S.pin) { lock(); start(); } else showGate();
setTimeout(function(){ checkUpdate(false); }, 4000);
})();
</script>
</body>
