<script>/* 영수증 글자(OCR 결과)에서 가게 이름·합계·날짜·결제수단을 뽑는다. Parser.guessCategory 필요 */
var Receipt = (function () {
  var TOTAL_KEYS = [
    /합\s*계\s*금\s*액/, /총\s*합\s*계/, /결\s*제\s*금\s*액/, /받\s*을\s*금\s*액/, /청\s*구\s*금\s*액/,
    /승\s*인\s*금\s*액/, /카\s*드\s*결\s*제/, /신\s*용\s*카\s*드/, /총\s*액/, /총\s*금\s*액/, /판\s*매\s*금\s*액/,
    /합\s*계/, /TOTAL/i, /결\s*제/

  var SKIP_TOTAL = /(부가세|부가가치세|과세물품|면세물품|공급가액|세액|할인|포인트|적립|거스름|잔액|받은금액|봉사료|VAT)/i;
  var NOT_STORE = /(영수증|사업자|대표|전화|TEL|주소|카드|승인|일시|번호|매출|고객|POS|포스|금액|합계|부가세|과세|면세|수량|단가|품명|상품|교환|환불|감사|www|http|\d{2,}-\d{2,}|\[|\]|^[\d\s.,:\-\/]+$)/i;

  function nums(line) {
    var out = [], m, re = /(\d{1,3}(?:[,.]\d{3})+|\d{3,8})\s*원?/g;
    while ((m = re.exec(line))) {
      var raw = m[1];
      var before = line.slice(Math.max(0, m.index - 1), m.index);
      var after = line.slice(m.index + m[0].length, m.index + m[0].length + 1);
      if (/[-\/:]/.test(before) || /^[-\/:]/.test(after)) continue; // 전화·사업자번호·날짜·시간

  }

  function findTotal(lines) {
    for (var k = 0; k < TOTAL_KEYS.length; k++) {
      for (var i = lines.length - 1; i >= 0; i--) {
        var L = lines[i];

        var n = nums(L);

    var m = text.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/) ||
            text.match(/(?:^|[^\d])(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})(?:[^\d]|$)/);

    if (!total) return { ok: false, store: store, date: date, text: raw };
    return { ok: true, store: store, total: total, date: date, text: raw,

  }

  return { parse: parse, findTotal: findTotal, findStore: findStore, findDate: findDate };
})();

    ctx.fx = null;
    if (!l || !l.currency || l.currency === 'KRW') return Promise.resolve();
    var key = 'tuk_fx_' + l.currency, cached = null;
    try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    if (cached && cached.at > Date.now() - 6 * 3600e3) { ctx.fx = cached; return Promise.resolve(); }
    return fetch('https://api.frankfurter.app/latest?from=' + l.currency + '&to=KRW').then(function (r) { return r.json(); }).then(function (o) {
      if (o && o.rates && o.rates.KRW) { ctx.fx = { cur: l.currency, rate: o.rates.KRW, at: Date.now(), date: o.date }; try { localStorage.setItem(key, JSON.stringify(ctx.fx)); } catch (e) {} }
    }).catch(function () { if (cached) ctx.fx = cached; });
  }
  function createLedger(p) {
    return ins('ledgers', [{ household_id: ctx.hh, name: String(p.name || '여행').slice(0, 30), kind: p.kind || '여행', currency: (p.currency || 'KRW').toUpperCase().slice(0, 3), starts_on: p.starts || null, ends_on: p.ends || null }], true)
      .then(function (rows) { var l = rows && rows[0]; if (l) try { localStorage.setItem('tuk_ledger', l.id); } catch (e) {} return { ok: true, id: l && l.id }; });
  }
  function switchLedger(id) { try { localStorage.setItem('tuk_ledger', id || ''); } catch (e) {} return Promise.resolve({ ok: true }); }
  function archiveLedger(id) { return upd('ledgers', 'id=eq.' + id + '&is_default=eq.false', { archived: true }).then(function () { try { localStorage.removeItem('tuk_ledger'); } catch (e) {} return { ok: true }; }); }

  /* ---------- 쓰기 ---------- */
  function txRow(t) {
    var amt = Math.round(Number(t.amount)), l = ctx.ledger;
    var row = { household_id: ctx.hh, client_id: String(t.id).slice(0, 60), member_id: memId(t.who), date: t.date, type: t.type, category: t.category || '', amount: amt, amount_base: amt,
      scope: t.scope === '개인' ? '개인' : '공용', description: String(t.desc || '').slice(0, 100), method: t.method || '', memo: String(t.memo || '').slice(0, 300), source: 'manual',
      ledger_id: l ? l.id : null };
    // 여행 가계부(외화): 화면에는 원화로 보이고, 원래 외화 금액은 따로 남겨요
    if (t.fx && t.fx.cur && t.fx.rate) { row.currency = t.fx.cur; row.amount = t.fx.amount; row.fx_rate = t.fx.rate; }
    return row;
  }
  function add(items) {
    return Promise.all(items.map(function (t) {
      return ins('transactions', [txRow(t)]).catch(function (e) { if (String(e.code) === '23505') return; throw e; });
    })).then(function () { return { ok: true }; });
  }
  function update(t) { var r = txRow(t); delete r.client_id; delete r.household_id; delete r.ledger_id; return upd('transactions', hhf() + '&' + byClient(t.id), r).then(function () { return { ok: true }; }); }
  function remove(id) { return upd('transactions', hhf() + '&' + byClient(id), { deleted_at: new Date().toISOString() }).then(function () { return { ok: true }; }); }
  function saveCats(cats) {
    return del('categories', hhf()).then(function () {
      return ins('categories', cats.map(function (c, i) { return { household_id: ctx.hh, type: c.type, name: c.name, budget: Math.round(Number(c.budget) || 0), keywords: c.keywords || '', sort: i + 1, fixed: !!c.fixed }; }));
    }).then(function () { return { ok: true }; });
  }
  function saveRec(list) {
    return del('recurring', hhf()).then(function () {
      if (!list.length) return;
      return ins('recurring', list.map(function (r) {
        var n = window.Recur ? Recur.norm(r) : { cycle: r.cycle, every: r.every, start: r.start };
        return { household_id: ctx.hh, client_id: String(r.id).slice(0, 60), type: r.type, category: r.category || '', description: r.desc || '', amount: Math.round(r.amount), day: Number(n.start.slice(8)),
          method: r.method || '', active: r.active !== false, cycle: n.cycle, every: n.every, starts_on: n.start, remind_days: r.remind || 0 };
      }));
    }).then(function () { return { ok: true }; });
  }
  function saveWish(w) {
    var row = { household_id: ctx.hh, client_id: String(w.id).slice(0, 60), name: w.name, price: Math.round(Number(w.price) || 0), link: w.link || '', kind: w.kind || '', need: !!w.need, memo: w.memo || '',
      reason: w.reason || '', need_by: w.needBy || null, cond: w.cond || '없음', target: Math.round(Number(w.target) || 0), status: w.status, requested_by: memId(w.by), request_msg: w.msg || '',
      reply: w.reply || '', handled_by: w.handledBy ? memId(w.handledBy) : null, handled_at: w.handled || null };
    return q('wishes', 'select=id&' + hhf() + '&' + byClient(w.id)).then(function (ex) {
      if (ex && ex.length) { delete row.client_id; delete row.household_id; return upd('wishes', 'id=eq.' + ex[0].id, row); }
      return ins('wishes', [row]);
    }).then(function () { return { ok: true }; });
  }
  function deleteWish(id) { return del('wishes', hhf() + '&' + byClient(id)).then(function () { return { ok: true }; }); }
  function saveCfg(p) {
    var jobs = [];
    if (p.monthStart != null) jobs.push(upd('households', 'id=eq.' + ctx.hh, { month_start: p.monthStart }));
    if (p.hide) jobs.push(upd('members', 'id=eq.' + ctx.meId, { hide_personal: p.hide.indexOf(memName(ctx.meId)) >= 0 }));
    if (p.allowance) ctx.members.forEach(function (m) { var a = p.allowance[m.display_name]; jobs.push(rpc('set_allowance', { p_member: m.id, p_amount: a ? Math.round(a.a || a) : 0, p_period: a && a.p === '주' ? '주' : '월' })); });
    if (p.cards || p.methods) {
      var ms = p.methods || p.cards.map(function (c) { return c.name; }), cs = p.cards || [];
      jobs.push(del('cards', hhf()).then(function () {
        if (!ms.length) return;
        return ins('cards', ms.map(function (n, i) {
          var c = cs.filter(function (x) { return x.name === n; })[0] || {};
          return { household_id: ctx.hh, name: n, kind: c.kind || (/체크/.test(n) ? '체크' : /현금/.test(n) ? '현금' : /이체|계좌/.test(n) ? '계좌이체' : /페이/.test(n) ? '페이' : '신용'),
            color: c.color || null, member_id: c.owner ? memId(c.owner) : null, monthly_target: c.target || 0, benefits: c.benefits || '', exclude_categories: c.exclude || [], memo: c.memo || '', sort: i, pay_day: c.payDay || null, use_from: c.payDay && c.useFrom || null, use_back: c.payDay && c.useBack || null, bills: c.bills || {} };
        }));
      }));
    }
    if (p.renameMethod) jobs.push(upd('transactions', hhf() + '&method=eq.' + enc(p.renameMethod.from), { method: p.renameMethod.to }));
    if (p.members) {
      // 목록에서 빠진 사람은 내보내고, 새 이름은 초대 자리로 만들어요
      var now = ctx.members.map(function (m) { return m.display_name; });
      p.members.filter(function (n) { return now.indexOf(n) < 0; }).forEach(function (n) {
        var kid = (p.kids || []).indexOf(n) >= 0;
        jobs.push(rpc('create_invite', { p_household: ctx.hh, p_role: kid ? 'child' : 'adult', p_display_name: n, p_guardian_consent: kid && !!p.consent }).then(function (code) { lastInvite = { name: n, code: code }; }));
      });
      ctx.members.filter(function (m) { return p.members.indexOf(m.display_name) < 0 && m.role !== 'owner'; }).forEach(function (m) { jobs.push(rpc('remove_member', { p_member: m.id })); });
    }
    return Promise.all(jobs).then(function () { return { ok: true, invite: lastInvite }; });
  }
  var lastInvite = null;
  function renameMember(p) { var id = memId(p.from); return upd('members', 'id=eq.' + id, { display_name: String(p.to).slice(0, 20) }).then(function () { return { ok: true }; }); }
  function saveAvatar(p) {
    var id = memId(p.name), path = ctx.hh + '/' + id + '.jpg';
    if (!p.data) return upd('members', 'id=eq.' + id, { avatar_path: null }).then(function () { return { ok: true }; });
    var bin = atob(p.data.split(',')[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return req('/storage/v1/object/avatars/' + path, { method: 'POST', body: new Blob([arr], { type: 'image/jpeg' }), headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' } })
      .then(function () { return upd('members', 'id=eq.' + id, { avatar_path: path }); }).then(function () { return { ok: true }; });
  }

  function call(action, p) {
    p = p || {};
    switch (action) {
      case 'load': return load(p);
      case 'add': return add(p.items || []);
      case 'update': return update(p.tx);
      case 'delete': return remove(p.id);
      case 'saveCats': return saveCats(p.cats || []);
      case 'saveRec': return saveRec(p.list || []);
      case 'saveWish': return saveWish(p.wish);
      case 'deleteWish': return deleteWish(p.id);
      case 'saveCfg': return saveCfg(p);
      case 'renameMember': return renameMember(p);
      case 'createLedger': return createLedger(p);
      case 'switchLedger': return switchLedger(p.id);
      case 'archiveLedger': return archiveLedger(p.id);
      case 'saveAvatar': return saveAvatar(p);
      case 'invite': return rpc('create_invite', { p_household: ctx.hh, p_role: p.role === 'child' ? 'child' : 'adult', p_display_name: p.name, p_guardian_consent: !!p.consent }).then(function (code) { return { code: code }; });
      case 'receipt': return req('/functions/v1/ocr', { method: 'POST', body: { image: p.image, mime: p.mime, household: ctx.hh } }).then(function (o) {
        if (!o || !o.ok) return { ok: false, message: (o && o.message) || '영수증을 읽지 못했어요.' };
        var c = window.__appCtx ? window.__appCtx() : { cats: [], methods: [], history: {} };
        var r = window.Receipt ? Receipt.parse(o.text, { today: new Date(), cats: c.cats, methods: c.methods, history: c.history }) : { ok: false };
        if (r.item) r.item.memo = '영수증';
        return { ok: r.ok, item: r.item || null, store: r.store, date: r.date, memo: '영수증', message: r.ok ? '영수증을 읽었어요' : '합계 금액을 찾지 못했어요. 금액을 직접 넣어 주세요.' };
      }, function (e) { return { ok: false, message: e.message }; });
      default: return Promise.resolve({ ok: true });
    }
  }

  /* ---------- 로그인 화면 ---------- */
  function providers() { return fetch(URL + '/auth/v1/settings', { headers: { apikey: KEY } }).then(function (r) { return r.json(); }).then(function (o) { return (o && o.external) || {}; }).catch(function () { return {}; }); }
  function back() { return location.origin + location.pathname; }
  function oauth(p) { location.href = URL + '/auth/v1/authorize?provider=' + p + '&redirect_to=' + enc(back()); }
  function el(id) { return document.getElementById(id); }
  function say(m) { if (typeof window.__toast === 'function') window.__toast(m); else alert(m); }
  function gate(onReady) {
    var g = el('gate'); el('app').classList.add('hidden'); g.classList.remove('hidden');
    if (getSess()) return afterLogin(g, onReady);
    var logo = (document.querySelector('.top h1 .logo') || {}).outerHTML || '';
    g.innerHTML = '<div class="gatelogo">' + logo + '</div><h2>툭장부</h2><div class="muted sm" style="margin-top:-4px">말로 툭, 가족 가계부</div>' +
      '<div class="loginbtns">' +
      '<button class="lbtn kakao" data-p="kakao"><b>K</b>카카오로 시작하기</button>' +
      '<button class="lbtn naver" data-p="naver"><b>N</b>네이버로 시작하기</button>' +
      '<button class="lbtn google" data-p="google"><b>G</b>Google로 시작하기</button>' +
      '<button class="lbtn email" id="lEmail">이메일로 시작하기</button>' +
      '<button class="linkbtn" id="lCode" style="margin-top:6px">초대 코드를 받았어요 (아이)</button></div>' +
      '<div class="faint xs" style="margin-top:14px;max-width:280px;text-align:center">시작하면 이용약관과 개인정보 처리방침에 동의하는 것으로 봐요.</div>';
    providers().then(function (ext) {
      g.querySelectorAll('[data-p]').forEach(function (b) {
        var p = b.dataset.p;
        b.onclick = function () {
          if (p === 'naver') return say('네이버 로그인은 곧 열려요. 카카오·이메일로 먼저 시작해 주세요.');
          if (!ext[p]) return say((p === 'kakao' ? '카카오' : 'Google') + ' 로그인은 설정 마무리 중이에요. 이메일로 먼저 시작해 주세요.');
          oauth(p);
        };
      });
    });
    el('lEmail').onclick = function () { emailStep(g, onReady); };
    el('lCode').onclick = function () { kidStep(g, onReady); };
  }
  function emailStep(g, onReady) {
    g.innerHTML = '<h2>이메일로 시작하기</h2><div class="muted sm">메일로 6자리 코드(또는 로그인 링크)를 보내 드려요.</div>' +
      '<input id="eMail" class="inp" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" style="width:260px;margin-top:14px">' +
      '<button class="btn pri" id="eSend" style="width:260px;margin-top:8px">코드 받기</button><button class="linkbtn" id="eBack" style="margin-top:10px">뒤로</button>';
    el('eBack').onclick = function () { gate(onReady); };
    el('eSend').onclick = function () {
      var email = el('eMail').value.trim(); if (!/.+@.+\..+/.test(email)) return say('이메일 주소를 확인해 주세요.');
      this.disabled = true;
      fetch(URL + '/auth/v1/otp?redirect_to=' + enc(back()), { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, create_user: true }) })
        .then(function (r) { if (!r.ok) return r.json().then(function (o) { throw new Error(o.msg || o.message || '보내지 못했어요'); }); })
        .then(function () {
          g.innerHTML = '<h2>메일을 확인해 주세요</h2><div class="muted sm">' + email + '로 보냈어요. 링크를 누르거나 코드를 입력하세요.</div>' +
            '<input id="eCode" class="inp pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="margin-top:14px">' +
            '<button class="btn pri" id="eVerify" style="width:220px">확인</button><button class="linkbtn" id="eBack2" style="margin-top:10px">다른 이메일</button>';
          el('eBack2').onclick = function () { emailStep(g, onReady); };
          var verify = function () {
            var code = el('eCode').value.trim(); if (code.length < 6) return;
            fetch(URL + '/auth/v1/verify', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'email', email: email, token: code }) })
              .then(function (r) { return r.json().then(function (o) { if (!r.ok) throw new Error(o.msg || '코드가 맞지 않아요'); return o; }); })
              .then(function (o) { setSess(fromToken(o)); afterLogin(g, onReady); }).catch(function (e) { say(e.message); });
          };
          el('eVerify').onclick = verify; el('eCode').oninput = function () { if (this.value.length === 6) verify(); };
        }).catch(function (e) { say(e.message); el('eSend').disabled = false; });
    };
  }
  function kidStep(g, onReady) {
    g.innerHTML = '<h2>초대 코드로 들어가기</h2><div class="muted sm">부모님이 보내 준 8자리 코드를 넣어 주세요.</div>' +
      '<input id="kCode" class="inp" maxlength="8" style="width:220px;margin-top:14px;text-transform:uppercase;text-align:center;letter-spacing:4px;font-size:22px">' +
      '<button class="btn pri" id="kGo" style="width:220px;margin-top:8px">들어가기</button><button class="linkbtn" id="kBack" style="margin-top:10px">뒤로</button>';
    el('kBack').onclick = function () { gate(onReady); };
    el('kGo').onclick = function () {
      var code = el('kCode').value.trim().toUpperCase(); if (code.length !== 8) return say('8자리 코드를 넣어 주세요.');
      // 아이는 이메일 없이 이 기기 전용 계정으로 들어와요
      fetch(URL + '/auth/v1/signup', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ data: {} }) })
        .then(function (r) { return r.json().then(function (o) { if (!r.ok) throw new Error(o.msg || '지금은 코드로 들어갈 수 없어요. 이메일로 시작한 뒤 코드를 넣어 주세요.'); return o; }); })
        .then(function (o) { setSess(fromToken(o)); return rpc('accept_invite', { p_code: code, p_display_name: null }); })
        .then(function () { afterLogin(g, onReady); }).catch(function (e) { say(e.message); });
    };
  }
  function afterLogin(g, onReady) {
    g.innerHTML = '<div class="loading">가족 정보를 불러오는 중…</div>';
    loadCtx().then(function (me) {
      if (me) return onReady();
      // 가족이 없으면: 새로 만들기 또는 초대 코드
      g.innerHTML = '<h2>환영해요!</h2><div class="muted sm">새 가계부를 만들거나, 받은 초대 코드를 넣어 주세요.</div>' +
        '<input id="oName" class="inp" maxlength="20" placeholder="내 이름 (예: 정열, 엄마)" style="width:260px;margin-top:14px">' +
        '<div class="seg" style="width:260px;margin-top:8px">' + [['couple', '커플'], ['married', '부부'], ['family', '가족'], ['solo', '혼자']].map(function (k, i) { return '<button data-k="' + k[0] + '" class="' + (i === 1 ? 'on' : '') + '">' + k[1] + '</button>'; }).join('') + '</div>' +
        '<button class="btn pri" id="oMake" style="width:260px;margin-top:10px">새 가계부 만들기</button>' +
        '<div class="faint xs" style="margin:14px 0 6px">또는 초대 코드</div><input id="oCode" class="inp" maxlength="8" placeholder="8자리 코드" style="width:260px;text-transform:uppercase;text-align:center;letter-spacing:3px">' +
        '<button class="btn" id="oJoin" style="width:260px;margin-top:8px">코드로 들어가기</button><button class="linkbtn" id="oOut" style="margin-top:12px">다른 계정으로 로그인</button>';
      var kind = 'married';
      g.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { kind = b.dataset.k; g.querySelectorAll('[data-k]').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
      el('oMake').onclick = function () {
        var n = el('oName').value.trim(); if (!n) return say('내 이름을 적어 주세요.');
        this.disabled = true;
        rpc('create_household', { p_name: n + '네 가계부', p_kind: kind, p_display_name: n }).then(function () { try { localStorage.setItem('hhb_needSetup', 'true'); } catch (e) {} onReady(); }).catch(function (e) { say(e.message); el('oMake').disabled = false; });
      };
      el('oJoin').onclick = function () {
        var c = el('oCode').value.trim().toUpperCase(), n = el('oName').value.trim() || null; if (c.length !== 8) return say('8자리 코드를 넣어 주세요.');
        rpc('accept_invite', { p_code: c, p_display_name: n }).then(function () { onReady(); }).catch(function (e) { say(e.message); });
      };
      el('oOut').onclick = function () { logout(); gate(onReady); };
    }).catch(function (e) { if (e.code === 'AUTH' || e.status === 401) { setSess(null); gate(onReady); } else g.innerHTML = '<div class="empty">연결하지 못했어요: ' + e.message + '<div style="margin-top:12px"><button class="btn pri" onclick="location.reload()">다시 시도</button></div></div>'; });
  }
  function logout() { var s = getSess(); setSess(null); if (s) fetch(URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + s.access_token } }).catch(function () {}); }

  window.BACKEND = { call: call, gate: gate, logout: logout, ctx: ctx, loggedIn: function () { return !!getSess(); } };
})();
</script>
<style>
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#1C1B19; --ink2:#5F5C55; --ink3:#9A968C; --line:#E7E4DC;
  --pri:#0F766E; --pri-ink:#FFFFFF; --pri-soft:#E2F1EE; --exp:#1C1B19; --inc:#2459C9; --sav:#0F7A3D;
  --warn:#B45309; --warn-soft:#FDF0DC; --bad:#C2410C; --bad-soft:#FCE6DB; --chip:#F0EEE8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04); --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141413; --card:#1F1E1C; --ink:#F2F0EA; --ink2:#B9B5AB; --ink3:#7E7A71; --line:#2E2C29;
    --pri:#2DD4BF; --pri-ink:#062A26; --pri-soft:#143430; --exp:#F2F0EA; --inc:#7FA7FF; --sav:#5BD08A;
    --warn:#F5B556; --warn-soft:#3A2D16; --bad:#FF8A5C; --bad-soft:#3D2117; --chip:#2A2926; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:calc(72px + var(--sab, env(safe-area-inset-bottom, 0px)))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px}
.sync{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sav)}
.dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .sm{font-size:13px} .xs{font-size:12px}
.big{font-size:28px;font-weight:750;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin:10px 0 8px}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:8px;transition:width .3s}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
textarea.say{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:12px;padding:12px 44px 12px 12px;background:var(--bg);resize:none;outline:none}
textarea.say:focus{border-color:var(--pri)}
.saybox{position:relative}
.voice{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.micbig{flex:none;width:76px;height:76px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,118,110,.28);cursor:pointer;position:relative}
.micbig svg{width:34px;height:34px}
.micbig.rec{background:var(--bad);box-shadow:0 0 0 0 rgba(194,65,12,.5);animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(194,65,12,.45)}70%{box-shadow:0 0 0 18px rgba(194,65,12,0)}100%{box-shadow:0 0 0 0 rgba(194,65,12,0)}}
.micbig.hint{animation:hint 1.6s infinite}
@keyframes hint{50%{transform:scale(1.06)}}
.vt{min-width:0;flex:1}
.vt b{display:block;font-size:16px}
.vt span{display:block;font-size:13px;color:var(--ink3);word-break:keep-all}
.vt .live{color:var(--ink);font-size:15px;font-weight:600}
.auto{display:flex;align-items:center;gap:10px;background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.auto i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.auto i::after{content:"";position:absolute;inset:0;background:var(--pri);transform-origin:left;animation:shrink var(--d,3s) linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.rcrow{margin-top:8px;gap:8px}
.rcrow .btn{display:flex;align-items:center;justify-content:center;gap:6px}
.rcwait{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--pri);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.toast .tact{margin-left:12px;border:0;background:transparent;color:#5EEAD4;font-weight:700;padding:6px 4px;pointer-events:auto;flex:none}
@media (prefers-color-scheme: dark){ .toast .tact{color:#0F766E} }
.toast.has-act{pointer-events:auto;display:flex;align-items:center;width:min(92vw,440px)}
.toast.has-act span{flex:1;min-width:0}
.banner{display:flex;align-items:center;gap:10px;background:var(--pri-soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}
.banner .grow{min-width:0}
.banner.warn{background:var(--warn-soft)}
.banner .btn{padding:7px 12px;font-size:13.5px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 2px;margin-top:10px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 10px;font-size:13.5px;text-align:left;line-height:1.3}
.quick button small{display:block;color:var(--ink3);font-size:12px}
.dup{display:inline-block;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 6px;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.cal .h{font-size:12px;text-align:center;color:var(--ink3);padding:4px 0}
.cal .h.sun,.cal .d.sun .n{color:var(--bad)} .cal .h.sat,.cal .d.sat .n{color:var(--inc)}
.cal .d{min-height:54px;border-radius:10px;padding:4px 3px;text-align:center;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px}
.cal .d .n{font-size:13px;font-weight:600}
.cal .d .e{font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.cal .d .i{font-size:10.5px;color:var(--inc);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.cal .d.today .n{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 6px}
.cal .d.sel{background:var(--pri-soft)}
.cal .d.out{visibility:hidden}
.lockscreen{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.x{min-width:36px;min-height:36px}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}
.wish{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--card)}
.wish.met{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.wish .nm{font-weight:700;font-size:15.5px}
.wish .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wish .cond{font-size:12.5px;color:var(--ink2);margin-top:6px}
.wish .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.wish .acts .btn{padding:8px 12px;font-size:13.5px}
.okbadge{display:inline-block;background:var(--pri);color:var(--pri-ink);border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px;margin-left:6px;vertical-align:1px}
.stbadge{display:inline-block;border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px;margin-left:6px;background:var(--chip);color:var(--ink2)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:700;flex:none;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover}
.chip .av{margin:-2px 6px -2px -4px}
.btn .av{margin-right:8px}
.item.locked .t{color:var(--ink2)}
.flex-row{padding:6px 0}
.addrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.micsm{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(15,118,110,.25)}
.micsm svg{width:22px;height:22px}
.micsm.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,65,12,.45)}100%{box-shadow:0 0 0 14px rgba(194,65,12,0)}}
.loginbtns{display:flex;flex-direction:column;gap:10px;width:280px;margin-top:22px}
.lbtn{position:relative;border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer}
.lbtn b{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-weight:900}
.lbtn.kakao{background:#FEE500;color:#191919}
.lbtn.naver{background:#03C75A;color:#fff}
.lbtn.google{background:#fff;color:#1f1f1f;border:1px solid #DADCE0}
.lbtn.email{background:var(--chip);color:var(--ink)}
.invcode{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.ledgerbar{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.ledgerbar button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--ink)}
.fxtag{align-self:center;font-size:12px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:8px;padding:3px 8px}
.memrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.memrow:first-of-type{border-top:0}
.rolebadge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.rolebadge.kid{background:var(--warn-soft);color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--pri);font-weight:700;padding:0;text-decoration:underline;font-size:inherit;cursor:pointer}
.settabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:6px}
.settabs::-webkit-scrollbar{display:none}
.settabs button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:9px 11px;font-weight:600;font-size:14px}
.settabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.paychip .pdot{width:10px;height:10px}
.paychip small{opacity:.75}
.paycard{display:inline-block;width:34px;height:22px;border-radius:5px;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.paypreview{margin-top:12px;border-radius:14px;color:#fff;padding:16px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 -18px 0 rgba(0,0,0,.12)}
.paypreview b{font-size:17px} .paypreview span{font-size:13px;opacity:.9}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colorbtn{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--ink3)}
.colorbtn.on{border-color:var(--card);box-shadow:0 0 0 2px var(--ink)}
.bar.thin{height:6px;margin:6px 0 2px}
.bar i.ok{background:var(--sav)}
.cardrow{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 0;color:inherit;font:inherit;cursor:pointer}
.cardrow:first-of-type{border-top:0}
.benefit{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.fxck{grid-column:3 / 5;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);white-space:nowrap}
.set-row .fxck input{width:auto}
.avedit{display:flex;align-items:center;gap:14px;margin-top:12px}
.stbadge.s-보류{background:var(--chip);color:var(--ink2)}
.wsec{display:flex;flex-direction:column;gap:2px;margin:0 0 4px}
.wsec small{color:var(--ink3);font-size:12px}
.need .wish{padding:10px 0}
.stbadge.s-승인{background:#DFF3E6;color:var(--sav)} .stbadge.s-거절{background:var(--bad-soft);color:var(--bad)} .stbadge.s-요청{background:var(--warn-soft);color:var(--warn)}
@media (prefers-color-scheme: dark){ .stbadge.s-승인{background:#16301F} }
.msgq{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px}
.nav button{padding:4px 8px}
.old-native body{padding-top:36px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-of-type{border-bottom:0}
.toggle input{width:44px;height:26px;accent-color:var(--pri)}
@media (prefers-reduced-motion: reduce){.micbig.rec,.micbig.hint{animation:none}}
.mic{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--pri);display:none;align-items:center;justify-content:center;font-size:18px}
.mic.on{display:flex} .mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--chip);cursor:pointer}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.pv{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.pv input,.pv select{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;min-width:0}
.pv input:focus,.pv select:focus{border-color:var(--line);background:var(--card);outline:none}
.pv .amt{width:92px;flex:none;text-align:right;font-weight:700}
.pv .desc{flex:1;font-weight:600}
.pv .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{background:var(--chip);border-radius:999px;padding:7px 10px !important;font-size:13px !important;border:0 !important;min-height:32px}
.pill.t-수입{background:#E3ECFF;color:var(--inc)} .pill.t-저축{background:#DFF3E6;color:var(--sav)}
@media (prefers-color-scheme: dark){ .pill.t-수입{background:#1C2840} .pill.t-저축{background:#16301F} }
.x{border:0;background:transparent;color:var(--ink3);font-size:18px;padding:0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list .day{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:14px 2px 6px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt-지출{color:var(--exp)} .amt-수입{color:var(--inc)} .amt-저축{color:var(--sav)}
.item .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + var(--sab, env(safe-area-inset-bottom, 0px)));z-index:20}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink3);padding:4px 14px}
.nav button b{font-size:20px;font-weight:400;line-height:1.1}
.nav button.on{color:var(--pri);font-weight:700}
.mnav{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0}
.mnav button{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:16px}
.mnav b{font-size:17px;min-width:120px;text-align:center}
.sumrow{display:flex;gap:8px}
.sumrow>div{flex:1;background:var(--bg);border-radius:12px;padding:10px}
.sumrow .k{font-size:12px;color:var(--ink3)} .sumrow .v{font-weight:700;font-variant-numeric:tabular-nums}
.cat{padding:10px 0;border-bottom:1px solid var(--line)} .cat:last-child{border-bottom:0}
.cat .bar{margin:6px 0 0;height:6px}
.trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.trend .b{width:100%;max-width:34px;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:2px}
.trend .b.cur{background:var(--ink)}
.trend .l{font-size:11.5px;color:var(--ink3)} .trend .v{font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--sab, env(safe-area-inset-bottom, 0px)));max-height:92vh;overflow:auto}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg.sm2 button{padding:6px;font-size:13px}
.fc{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.5}
.ptag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:600;background:var(--chip);color:var(--ink2);vertical-align:1px}
.pill.sc-개인{background:var(--pri-soft);font-weight:600}
details.fold>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'›';font-size:20px;color:var(--ink3);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
.needby{margin-top:6px;font-size:13px;color:var(--ink2)} .needby.soon{color:var(--bad);font-weight:600}
.fld{margin:12px 0}
.fld label{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);outline:none}
.inp:focus{border-color:var(--pri)}
.inp.amtbig{font-size:24px;font-weight:750;text-align:right}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid .chip{font-size:13.5px}
.empty{text-align:center;color:var(--ink3);padding:28px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab, env(safe-area-inset-bottom, 0px)));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.gate{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.gate h2{margin:6px 0 6px;font-size:22px}
.pin{font-size:28px;letter-spacing:10px;text-align:center;width:220px;margin:18px 0}
.set-row{display:grid;grid-template-columns:70px 1fr 96px 28px;gap:6px;align-items:center;margin:6px 0}
.set-row input,.set-row select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--bg);width:100%;font-size:14px;min-width:0}
.set-row .kw{grid-column:1 / 3;font-size:12.5px;color:var(--ink2)}
.rec-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.rec-row input,.rec-row select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--bg);width:100%;font-size:14px;min-width:0}
h3{font-size:15px;margin:0 0 8px}
.hidden{display:none !important}
[hidden]{display:none !important}
.tip{background:var(--pri-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.loading{padding:40px 0;text-align:center;color:var(--ink3)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:4px;vertical-align:1px}

/* ---------- 툭장부 디자인 다듬기 ---------- */
html,body{font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,Roboto,"Malgun Gothic",sans-serif;letter-spacing:-.15px}
:root{--r:20px;--shadow:0 1px 1px rgba(16,24,20,.03),0 6px 20px rgba(16,24,20,.05)}
.top{padding:10px 0 6px}
.top h1{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.6px}
.top h1 .logo{width:30px;height:30px;flex:none;border-radius:9px}
.gatelogo .logo{width:76px;height:76px;border-radius:22px;box-shadow:0 10px 30px rgba(15,118,110,.3)}
.card{border-radius:var(--r);padding:18px;border-color:transparent}
@media (prefers-color-scheme: dark){ .card{border-color:var(--line)} }
.card h3{font-size:16px;font-weight:750;letter-spacing:-.3px}
.btn{border-radius:14px;font-weight:700}
.btn.ghost{background:var(--card)}
.chip{border-radius:999px;padding:7px 13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ico{border-radius:14px}
.item{padding:12px 2px}
.item .t{font-weight:650}
/* 홈 요약 카드: 브랜드 색 */
.card.hero{background:linear-gradient(145deg,#14A08F 0%,#0F766E 55%,#0B5E57 100%);color:#fff;border:0;box-shadow:0 12px 30px rgba(15,118,110,.28)}
.card.hero .muted,.card.hero .faint{color:rgba(255,255,255,.78)}
.card.hero .big{font-size:34px}
.card.hero .bar{background:rgba(255,255,255,.22)}
.card.hero .bar>i{background:#fff}
.card.hero .bar>i.warn{background:#FFD27A} .card.hero .bar>i.bad{background:#FFB199}
.card.hero .sumrow>div{background:rgba(255,255,255,.13);backdrop-filter:blur(2px)}
.card.hero .sumrow .k{color:rgba(255,255,255,.75)}
.card.hero .sumrow .v,.card.hero .amt-수입,.card.hero .amt-저축{color:#fff}
.card.hero .seg{background:rgba(0,0,0,.16)}
.card.hero .seg button{color:rgba(255,255,255,.8)}
.card.hero .seg button.on{background:#fff;color:#0B5E57;box-shadow:none}
.card.hero .fc{background:rgba(0,0,0,.14);color:#fff}
.card.hero b[style*="--bad"]{color:#FFD6C7 !important}
.card.hero .num b,.card.hero b{color:#fff}
/* 마이크 */
.micbig{width:84px;height:84px;background:radial-gradient(circle at 35% 30%,#1FB5A2,#0F766E 70%);box-shadow:0 0 0 8px var(--pri-soft),0 10px 24px rgba(15,118,110,.32)}
.voice{gap:16px;margin:6px 0 14px}
.vt b{font-size:17px;font-weight:750}
/* 아래 메뉴 */
.nav{backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--card) 88%,transparent);border-top-color:transparent;box-shadow:0 -6px 20px rgba(16,24,20,.05)}
.nav button{position:relative;padding:6px 14px;font-weight:600}
.nav button.on::before{content:"";position:absolute;top:2px;left:50%;width:44px;height:30px;transform:translateX(-50%);background:var(--pri-soft);border-radius:999px;z-index:-1}
.nav button svg{position:relative}
.banner{border-radius:16px}
.toast{border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sheet{border-radius:24px 24px 0 0}
</style>
</head>

<div id="app" class="hidden">
  <div class="wrap">
    <div class="top">
      <h1 id="title"><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">  <defs>    <linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1">      <stop offset="0" stop-color="#14A08F"/>      <stop offset="1" stop-color="#0B5E57"/>    </linearGradient>    <linearGradient id="lgcoin" x1="0" y1="0" x2="0" y2="1">      <stop offset="0" stop-color="#FFD27A"/>      <stop offset="1" stop-color="#F2A93B"/>    </linearGradient>  </defs>  <rect width="512" height="512" rx="116" fill="url(#lgbg)"/>    <rect x="100" y="140" width="290" height="214" rx="68" fill="#FFFFFF"/>  <path d="M150 330 L132 414 Q130 424 140 419 L232 350 Z" fill="#FFFFFF"/>    <rect x="148" y="214" width="170" height="24" rx="12" fill="#0F766E" opacity=".9"/>  <rect x="148" y="262" width="112" height="24" rx="12" fill="#0F766E" opacity=".35"/>    <circle cx="356" cy="162" r="58" fill="url(#lgcoin)" stroke="#FFFFFF" stroke-width="10"/>  <rect x="348" y="134" width="16" height="56" rx="8" fill="#B8741A" opacity=".55"/>    <path d="M424 92l22-22M436 132l30-6M398 72l6-30" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity=".9"/></svg><span>툭장부</span></h1>

    <button data-v="stats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10Z"/></svg>통계</button>

  </nav>
</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="내역 입력"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" style="white-space:pre-line"></div>
<div class="lockscreen hidden" id="lock"><div style="font-size:44px">🔒</div><h2 style="margin:0">툭장부가 잠겨 있어요</h2><div class="muted sm">지문, 얼굴 또는 화면 잠금으로 열 수 있어요.</div><button class="btn pri" id="unlockBtn" style="width:240px">지문·얼굴로 열기</button><div class="faint sm" id="lockMsg" style="max-width:300px"></div><div id="pinUnlock" style="display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:6px"><input class="inp pin" id="lockPin" type="password" inputmode="numeric" maxlength="8" placeholder="가족 비밀번호" style="width:240px;margin:0;font-size:22px;letter-spacing:6px" aria-label="가족 비밀번호"><button class="btn ghost" id="lockPinGo" style="width:240px">비밀번호로 열기</button></div></div>

<script>
/* 한국어 지출 문장 파서: "어제 점심 김밥천국 8천원, 커피 4500원 카드" → 항목 배열 */
var Parser = (function () {
  var HDIG = { '영': 0, '공': 0, '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '칠': 7, '팔': 8, '구': 9 };
  var SMALL = { '십': 10, '백': 100, '천': 1000 };
  var BIG = { '만': 1e4, '억': 1e8 };
  var COUNTERS = '월일시분개명번층호살세잔병권장회박인캔봉벌켤대등위퍼%';

  function koNum(s) {
    s = String(s).replace(/[\s,원]/g, '');
    var total = 0, section = 0, buf = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (/[0-9.]/.test(ch)) buf += ch;
      else if (ch in HDIG) buf += String(HDIG[ch]);
      else if (ch in SMALL) { section += (buf ? parseFloat(buf) : 1) * SMALL[ch]; buf = ''; }
      else if (ch in BIG) { section += buf ? parseFloat(buf) : 0; total += (section || 1) * BIG[ch]; section = 0; buf = ''; }
    }
    section += buf ? parseFloat(buf) : 0;
    return Math.round(total + section);
  }

  var RE_DIGIT = /\d[\d,]*(?:\.\d+)?(?:\s?[십백천만억](?:\s?\d[\d,]*(?:\.\d+)?)?)*(?:\s?원)?/g;
  var RE_HAN = /(^|[^가-힣0-9.,])([일이삼사오육칠팔구십백천만억](?:\s?[일이삼사오육칠팔구십백천만억]|[0-9,])*\s?원)/g;

  // 여행 중 외화: "커피 5달러", "택시 1200엔", "12.5 유로"
  var FX_WORDS = { '달러': 'USD', '불': 'USD', 'USD': 'USD', '엔': 'JPY', 'JPY': 'JPY', '유로': 'EUR', 'EUR': 'EUR', '위안': 'CNY', 'CNY': 'CNY', '바트': 'THB', 'THB': 'THB',
    '동': 'VND', 'VND': 'VND', '페소': 'PHP', 'PHP': 'PHP', '파운드': 'GBP', 'GBP': 'GBP', '대만달러': 'TWD', 'TWD': 'TWD' };
  var RE_FX = /(\d[\d,]*(?:\.\d+)?|[일이삼사오육칠팔구십백천만]+)\s*(대만달러|달러|불|엔|유로|위안|바트|동|페소|파운드|USD|JPY|EUR|CNY|THB|VND|PHP|GBP|TWD)(?![가-힣A-Za-z])/g;
  function findAmounts(text) {
    var res = [], m;
    function overlaps(st, en) { return res.some(function (r) { return st < r.end && en > r.start; }); }
    RE_FX.lastIndex = 0;
    while ((m = RE_FX.exec(text))) {
      var fv = /\d/.test(m[1]) ? parseFloat(m[1].replace(/,/g, '')) : koNum(m[1]);
      if (fv > 0) res.push({ start: m.index, end: m.index + m[0].length, value: fv, cur: FX_WORDS[m[2]] });
    }
    RE_HAN.lastIndex = 0;
    while ((m = RE_HAN.exec(text))) {
      var st = m.index + m[1].length, en = st + m[2].length;
      if (overlaps(st, en)) continue;
      var v2 = koNum(m[2]);
      if (v2 > 0) res.push({ start: st, end: en, value: v2 });
    }
    RE_DIGIT.lastIndex = 0;
    while ((m = RE_DIGIT.exec(text))) {
      var raw = m[0].replace(/\s+$/, '');
      var s0 = m.index, e0 = m.index + raw.length;
      if (overlaps(s0, e0)) continue;
      var next = text.charAt(e0);
      var hasUnit = /[십백천만억원]/.test(raw);
      if (!hasUnit && next && COUNTERS.indexOf(next) >= 0) continue;
      if (!hasUnit && /^\s*(년|월|일)/.test(text.slice(e0))) continue;
      var v = koNum(raw);
      if (!hasUnit && v < 100) continue;
      if (v <= 0) continue;
      res.push({ start: s0, end: e0, value: v });
    }
    return res.sort(function (a, b) { return a.start - b.start; });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  var WD = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
  var RE_DATE = /(오늘|어제|그제|그저께|엊그제|(\d{1,2})\s?월\s?(\d{1,2})\s?일|(\d{1,2})\s?일(?![가-힣])|(지난\s?주\s?)?([월화수목금토일])요일)/g;

  function findDates(text, today) {
    var res = [], m;
    RE_DATE.lastIndex = 0;
    while ((m = RE_DATE.exec(text))) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      var w = m[1];
      if (w === '오늘') { }
      else if (w === '어제') d.setDate(d.getDate() - 1);
      else if (w === '그제' || w === '그저께' || w === '엊그제') d.setDate(d.getDate() - 2);
      else if (m[2]) {
        d = new Date(today.getFullYear(), Number(m[2]) - 1, Number(m[3]));
        if (d > today) d.setFullYear(d.getFullYear() - 1);
      } else if (m[4]) {
        var day = Number(m[4]);
        if (day < 1 || day > 31) continue;
        d = new Date(today.getFullYear(), today.getMonth(), day);
        if (d > today) d = new Date(today.getFullYear(), today.getMonth() - 1, day);
      } else if (m[6]) {
        if (m[5]) {
          var mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7);
          d = new Date(mon); d.setDate(mon.getDate() + ((WD[m[6]] + 6) % 7));
        } else {
          d.setDate(d.getDate() - ((d.getDay() - WD[m[6]] + 7) % 7));
        }
      }
      res.push({ start: m.index, end: m.index + m[0].length, date: ymd(d) });
    }
    return res;
  }

  var METHOD_WORDS = [
    { re: /체크\s?카드|체크/, key: '체크' },
    { re: /신용\s?카드|카드\s?로|카드\s?결제|카드/, key: '카드' },
    { re: /현금/, key: '현금' },
    { re: /계좌\s?이체|이체|송금|토스로|토스/, key: '이체' },
    { re: /페이|삼성페이|애플페이|카카오페이|네이버페이/, key: '페이' }
  ];

  function matchMethod(seg, methods) {
    // 1) 등록한 카드·결제수단 이름을 그대로 말한 경우 (예: "삼성카드로", "생활비카드")
    var flat = seg.replace(/\s+/g, '');
    var byLen = methods.slice().sort(function (a, b) { return b.length - a.length; });
    for (var j = 0; j < byLen.length; j++) {
      var x = byLen[j], cands = [x, x.replace(/\s+/g, '')], tok = x.split(/\s+/)[0];
      if (tok.length >= 3 && tok !== x) cands.push(tok);
      for (var c = 0; c < cands.length; c++) {
        if (cands[c].length >= 2 && (seg.indexOf(cands[c]) >= 0 || flat.indexOf(cands[c].replace(/\s+/g, '')) >= 0) && !/^(신용카드|체크카드|카드)$/.test(cands[c])) {
          var at = seg.indexOf(cands[c]);
          return { method: x, word: at >= 0 ? seg.substr(at, cands[c].length) + (/^(로|으로)/.test(seg.slice(at + cands[c].length)) ? seg.slice(at + cands[c].length).match(/^(으로|로)/)[0] : '') : cands[c] };
        }
      }
    }
    for (var i = 0; i < METHOD_WORDS.length; i++) {
      var mm = seg.match(METHOD_WORDS[i].re);
      if (!mm) continue;
      var key = METHOD_WORDS[i].key, found = null;
      methods.forEach(function (x) {
        if (found) return;
        if (key === '체크' && /체크/.test(x)) found = x;
        else if (key === '카드' && /카드/.test(x) && !/체크/.test(x)) found = x;
        else if (key === '현금' && /현금/.test(x)) found = x;
        else if (key === '이체' && /이체|송금|계좌/.test(x)) found = x;
        else if (key === '페이' && /페이/.test(x)) found = x;
      });
      if (!found && key === '페이') methods.forEach(function (x) { if (!found && /카드/.test(x) && !/체크/.test(x)) found = x; });
      if (found) return { method: found, word: mm[0] };
    }
    return null;
  }

  var FILLER = /(썼어요|썼어|썼음|썼다|씀|사용했어요|사용했어|사용|결제했어요|결제했어|결제함|결제|지출했어|지출|구매했어|구매|샀어요|샀어|샀음|냈어요|냈어|냈음|나갔어|들어왔어요|들어왔어|들어옴|받았어요|받았어|받음|입금됐어|입금|그리고|그다음|정도|쯤|약|총|에다가)/g;
  var INCOME_HINT = /(들어왔|들어옴|받았|받음|입금|월급|급여|보너스|상여|환급)/;
  var SAVE_HINT = /(적금|저축|예금|청약|연금저축|IRP|ISA|비상금)/i;

  // 개인 용돈으로 쓴 돈인지, 가족 공용 돈인지
  var SCOPE_P = /(개인\s*용돈|내\s*용돈|용돈\s*(으로|에서|으론)|개인적으로|개인\s*지출|개인\s*돈|개인|사비로|사비|내\s*돈으로|내\s*돈)/;
  var SCOPE_P_G = new RegExp(SCOPE_P.source, 'g');
  var SCOPE_S = /(가족\s*공용|공용|가족|생활비|우리\s*집|집\s*돈)/;
  var SCOPE_STRIP = /(가족\s*공용으로|가족\s*공용|공용으로|공용|생활비로)/g;
  function stripScope(s) { return s.replace(SCOPE_P_G, ' ').replace(SCOPE_STRIP, ' '); }
  function detectScope(s) { return SCOPE_P.test(s) ? '개인' : SCOPE_S.test(s) ? '공용' : ''; }

  function cleanDesc(s) {
    s = s.replace(FILLER, ' ');
    s = s.replace(/[,.!?·~]+/g, ' ');
    var toks = s.split(/\s+/).filter(Boolean).map(function (t) {
      if (t.length > 2) t = t.replace(/(에서는|에서|이랑|하고|으로)$/, '');
      if (t.length > 1) t = t.replace(/(에|을|를|랑|은|는)$/, '');
      return t;
    }).filter(function (t) { return t && !/^(원|랑|하고|에|에서|로|으로|은|는|이|가)$/.test(t); });
    return toks.join(' ').trim();
  }

  var BUILTIN = [
    [/(술값|술자리|술집|맥주|소주|와인|호프|포차|이자카야|막걸리)/, [/술|유흥/, /외식|식비/]],
    [/(아침|점심|저녁|식사|밥값|회식|배달)/, /외식|식비/],
    [/(붕어빵|호떡|떡볶이|어묵|아이스크림|과자|빵집|베이커리|간식|디저트|탕후루)/, [/간식/, /카페/, /외식|식비/]],
    [/(학원|교재|학습지|과외|수강료|학교)/, /교육|학원|육아/],

/* 정기 지출 주기 계산 (앱과 서버가 같이 씀)
 * r: { cycle: '주'|'월'|'년'|'일', every: N, start: 'yyyy-MM-dd', day: (옛 자료: 매월 며칠) }

function forecast(){
  var now = new Date(), m = curM(), pr = period(m), today = ymd(now);
  var day = Math.round((new Date(today + 'T00:00:00') - new Date(pr.from + 'T00:00:00')) / 864e5) + 1, last = pr.days;
  var list = txOfMonth(m).filter(function(t){ return t.type === '지출'; });
  var fixed = list.filter(function(t){ return t.who === '자동'; }).reduce(function(s, t){ return s + t.amount; }, 0);
  var vari = list.filter(function(t){ return t.who !== '자동'; }).reduce(function(s, t){ return s + t.amount; }, 0);
  var tmr = ymd(new Date(now.getTime() + 864e5));
  var recLeft = (S.data.rec || []).filter(function(r){ return r.active !== false && r.type === '지출'; }).reduce(function(s, r){ return s + (r.amount || 0) * Recur.between(r, tmr, pr.to).length; }, 0);
  var past = [1, 2, 3].map(function(k){ return txOfMonth(shiftMonth(m, -k)).filter(function(t){ return t.type === '지출' && t.who !== '자동'; }).reduce(function(s, t){ return s + t.amount; }, 0); }).filter(Boolean);
  var avg = past.length ? past.reduce(function(a, b){ return a + b; }, 0) / past.length : 0;
  if (!avg && day < 5) return null; // 자료가 너무 적으면 예측하지 않아요
  var pace = vari / day * last, w = day / last;
  var est = avg ? (day < 5 ? avg : pace * w + avg * (1 - w)) : pace;

function isPayCard(c){ return c && (c.kind || '신용') === '신용' && +c.payDay > 0; }
function billRule(c){
  var pd = +c.payDay, f = +c.useFrom || 0, b = +c.useBack || 0;
  if (!f) { f = pd - 13; b = 1; if (f < 1) { f += 30; b = 2; } }
  return { pd: pd, f: f, b: b || 1 };
}
function dayIn(y, m0, d){ return new Date(y, m0, Math.min(d, new Date(y, m0 + 1, 0).getDate())); }
// payYm(yyyy-MM)에 나가는 결제: 이용기간과 결제일
function billPeriod(c, payYm){
  var r = billRule(c), y = +payYm.slice(0, 4), m0 = +payYm.slice(5) - 1;
  var from = dayIn(y, m0 - r.b, r.f), next = dayIn(from.getFullYear(), from.getMonth() + 1, r.f);
  return { ym: payYm, pay: ymd(dayIn(y, m0, r.pd)), from: ymd(from), to: ymd(new Date(next.getTime() - 864e5)) };
}
function billOf(c, payYm){

  pr.list = list; pr.est = list.reduce(function(a, t){ return a + t.amount; }, 0);

// 외화 → 원화 환율 (6시간 동안 저장해 둬요)
function fxFmt(r){ return r < 100 ? (Math.round(r * 100) / 100).toString() : won(r); }
function fxCached(cur){ var c = LS.get('fx_' + cur, null); return c && c.at > Date.now() - 6 * 3600e3 ? c.rate : 0; }
function fxFetch(cur){
  return fetch('https://api.frankfurter.app/latest?from=' + cur + '&to=KRW').then(function(r){ return r.json(); })
    .then(function(o){ var r = o && o.rates && o.rates.KRW; if (r) LS.set('fx_' + cur, { rate: r, at: Date.now() }); return r || 0; })
    .catch(function(){ var c = LS.get('fx_' + cur, null); return c ? c.rate : 0; });
}
function applyFx(){
  var need = [];
  S.preview.forEach(function(p){
    if (!p.cur || p.fx) return;
    var r = fxCached(p.cur);
    if (r) { p.fx = { cur: p.cur, rate: r, amount: p.amount }; p.amount = Math.round(p.amount * r); p.memo = (p.memo ? p.memo + ' · ' : '') + p.cur + ' ' + p.fx.amount + ' (1' + p.cur + '≈' + fxFmt(r) + '원)'; }
    else if (need.indexOf(p.cur) < 0) need.push(p.cur);
  });
  if (need.length) Promise.all(need.map(fxFetch)).then(function(){ if (S.preview.some(function(p){ return p.cur && !p.fx; }) && $('#pv')) { applyFx(); $('#pv').innerHTML = previewHTML(); bindPreview(); } });
}
function reparse(){
  S.preview = Parser.parse(S.draft, { today: new Date(), cats: cats(), methods: methods(), history: history(), defaultMethod: LS.get('lastMethod', ''), defaultScope: isKid() ? '개인' : '공용' });
  applyFx();
  $('#pv').innerHTML = previewHTML(); bindPreview();
  $('#saveAll').disabled = !S.preview.length;
  $('#saveAll').textContent = S.preview.length > 1 ? S.preview.length + '건 저장' : '저장';
}

function bindPreview(){

        else { p[f] = el.value; if (f === 'category') row.querySelector('.ico').textContent = icon(p.category); if (f === 'scope') el.className = 'pill sc-' + el.value; if (f === 'method') el.style.borderLeftColor = el.value ? payInfo(el.value).color : 'transparent'; }
      };

  });
}

function budgetNote(saved){
  var notes = [];
  var m = curM();
  var seen = {};
  saved.forEach(function(t){
    if (t.type !== '지출' || seen[t.category] || periodOf(t.date) !== m) return;
    seen[t.category] = 1;
    var c = cats('지출').filter(function(x){ return x.name === t.category; })[0];
    if (!c || !c.budget) return;
    var after = txOfMonth(m).filter(function(x){ return x.type === '지출' && x.category === t.category; }).reduce(function(s, x){ return s + x.amount; }, 0);
    var added = saved.filter(function(x){ return x.category === t.category && x.type === '지출'; }).reduce(function(s, x){ return s + x.amount; }, 0);
    var before = after - added, b = c.budget;
    if (after > b && before <= b) notes.push(t.category + ' 예산을 넘었어요 (' + Math.round(after / b * 100) + '%)');
    else if (after >= b * 0.8 && before < b * 0.8) notes.push(t.category + ' 예산의 ' + Math.round(after / b * 100) + '%를 썼어요');
  });
  var tot = budgetTotal();
  if (tot) {
    var all = sumBy(txOfMonth(m), '지출'), addAll = saved.filter(function(x){ return x.type === '지출' && periodOf(x.date) === m; }).reduce(function(s, x){ return s + x.amount; }, 0);
    if (all > tot && all - addAll <= tot) notes.push('이번 달 전체 예산을 넘었어요');
  }
  return notes.join(' · ');
}
function undoSave(saved){
  var ids = {}; saved.forEach(function(t){ ids[t.id] = 1; });
  S.data.tx = S.data.tx.filter(function(t){ return !ids[t.id]; });
  saved.forEach(function(t){ queue({ op: 'delete', id: t.id }); });
  toast('저장을 취소했어요'); render();
}
function announceSaved(saved){
  haptic();
  var total = saved.reduce(function(s, t){ return s + t.amount; }, 0);
  var msg = saved.length > 1 ? saved.length + '건, ' + won(total) + '원 저장했어요' : (saved[0].desc || saved[0].category) + ' ' + won(total) + '원 저장했어요';
  var note = budgetNote(saved);
  toast(msg + (note ? '\n' + note : ''), '실행 취소', function(){ undoSave(saved); }, note ? 6500 : 5000);
}
function isDup(p){
  return (S.data ? S.data.tx : []).some(function(t){ return t.date === p.date && t.amount === Math.round(p.amount) && t.type === p.type && t.id !== p.id; });
}
function saveItems(items){
  var now = new Date().toISOString();
  items = items.filter(function(p){
    var cp = p.amount && cardPayItem(p); if (!cp) return true;
    setBillActual(cp.card.name, cp.bill.ym, cp.amount, '💳 ' + cp.card.name + ' ' + mdLabel(cp.bill.pay) + ' 청구액 ' + won(cp.amount) + '원으로 기록했어요. 이미 쓴 날 지출로 잡혀 있어서 다시 더하지 않아요');
    return false;
  });
  if (!items.length) { S.draft = ''; S.preview = []; render(); return false; }
  var clean = items.filter(function(p){ return p.amount; }).map(function(p){
    return { id: p.id || uid(), date: p.date, type: p.type, category: p.category, amount: Math.round(p.amount), desc: p.desc, method: p.method, who: p.who || S.me, memo: p.memo || '', fx: p.fx || undefined, scope: p.scope === '개인' || (!p.scope && isKid()) ? '개인' : '공용', created: now };
  });
  if (!clean.length) return false;
  clean.forEach(function(t){ S.data.tx.push(t); });
  var lm = clean[clean.length - 1].method; if (clean[clean.length - 1].type === '지출' && lm) LS.set('lastMethod', lm);
  queue({ op: 'add', items: clean });
  return clean;
}

/* ---------- 영수증 사진 ---------- */
function shrinkImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 1800, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('사진을 열 수 없어요. 다른 사진으로 해 주세요.')); };
    img.src = url;
  });
}
function handleReceipt(file){
  if (!file) return;
  cancelAuto();
  S.rcBusy = true;
  var pv = $('#pv'); if (pv) pv.innerHTML = '<div class="pv rcwait"><span class="spin"></span>영수증을 읽고 있어요. 5~15초쯤 걸려요.</div>';
  shrinkImage(file).then(function(b64){ return call('receipt', { image: b64, mime: 'image/jpeg', who: S.me }, 70000); }).then(function(r){
    S.rcBusy = false;
    if (S.view !== 'home') return;
    if (r.ok && r.item) {
      r.item.who = S.me;
      S.preview = [r.item]; S.draft = '';
      var say = $('#say'); if (say) say.value = '';
      $('#pv').innerHTML = previewHTML(); bindPreview();
      var sb = $('#saveAll'); sb.disabled = false; sb.textContent = '저장';
      toast((r.item.desc || '영수증') + ' ' + won(r.item.amount) + '원을 읽었어요');
      if (LS.get('autoSave', true)) startAuto();
    } else {
      $('#pv').innerHTML = '';
      openEdit(null, { desc: r.store || '', date: r.date || ymd(new Date()), memo: r.memo || '' });
      toast(r.message || '합계 금액을 찾지 못했어요. 금액을 직접 넣어 주세요.');
    }
  }).catch(function(e){
    S.rcBusy = false;
    var p2 = $('#pv'); if (p2) p2.innerHTML = '';
    toast(e && e.code === 'NET' ? '서버에 연결하지 못했어요. 인터넷을 확인해 주세요.' : '영수증 읽기 실패: ' + (e && e.message || e));
  });
}

/* ---------- 원터치 음성 입력 ---------- */
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
var V = { rec: null };
function setMicUI(state, text, sub){
  var b = $('#micBig'), vt = $('#vt'); if (!b || !vt) return;
  b.classList.toggle('rec', state === 'rec'); b.classList.toggle('hint', state === 'hint');
  b.setAttribute('aria-label', state === 'rec' ? '녹음 멈추기' : '말로 입력');
  if (text != null) vt.innerHTML = '<b' + (state === 'live' ? ' class="live"' : '') + '>' + esc(text) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '');
}
function startListen(fromGesture){
  if (!SR || S.view !== 'home' || !$('#micBig')) return false;
  if (V.rec) { try{ V.rec.stop(); }catch(e){} return true; }
  cancelAuto();
  var rec; try { rec = new SR(); } catch (e) { return false; }
  rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  var base = S.draft ? S.draft.replace(/[\s,]*$/, '') + ', ' : '';
  V = { rec: rec, got: false, err: '', gesture: fromGesture };
  rec.onstart = function(){ setMicUI('rec', '듣고 있어요…', '말을 마치면 자동으로 멈춰요 · 다시 누르면 멈춤'); };
  rec.onresult = function(ev){
    var txt = ''; for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    txt = txt.trim(); if (!txt) return;
    V.got = true; S.draft = base + txt;
    var say = $('#say'); if (say) say.value = S.draft;
    setMicUI('rec', '“' + txt + '”', '듣고 있어요…');
  };
  rec.onerror = function(ev){ V.err = ev.error || 'error'; };
  rec.onend = function(){
    var st = V; V = { rec: null };
    if (st.got) {
      setMicUI('', '눌러서 말하기', '더 말하면 아래에 이어서 들어가요');
      reparse();
      if (S.preview.length && LS.get('autoSave', true)) startAuto();
      return;
    }
    if (st.err === 'not-allowed' || st.err === 'service-not-allowed') {
      if (st.gesture) { setMicUI('', '마이크를 쓸 수 없어요', IN_APP ? '휴대폰 설정 → 애플리케이션 → 툭장부 → 권한 → 마이크를 허용해 주세요' : isIOS() ? '설정 → Safari(또는 Chrome) → 마이크 허용, 그리고 설정 → Siri에서 받아쓰기를 켜 주세요' : '주소창의 자물쇠 → 권한 → 마이크 허용을 눌러 주세요'); }
      else setMicUI('hint', '눌러서 말하기', '버튼을 누르면 바로 들어요');
    } else {
      logErr('voice', st.err || 'none', st.gesture ? 'tap' : 'auto');
      if (!st.gesture) setMicUI('hint', '눌러서 말하기', '버튼을 누르면 바로 들어요'); // 자동으로 시작한 녹음은 실패해도 조용히 대기
      else if (st.err === 'no-speech' || !st.err) setMicUI('', '못 들었어요', '버튼을 누르고 다시 말해 주세요');
      else if (st.err === 'network') setMicUI('', '음성 인식이 인터넷에 연결되지 않았어요', '연결을 확인하거나 아래에 써 주세요');
      else if (st.err === 'aborted') setMicUI('', '눌러서 말하기', '예) 개인 용돈 술자리 3만원, 가족 저녁 식사 8만원');
      else setMicUI('', '잠시 후 다시 눌러 주세요', '음성 인식이 아직 준비되지 않았어요. 계속되면 아래에 써 주세요');
    }
  };
  try { rec.start(); } catch (e) { V = { rec: null }; if (!fromGesture) setMicUI('hint', '눌러서 말하기', '버튼을 누르면 바로 들어요'); return false; }
  return true;
}
// 평소보다 훨씬 큰 금액이거나 내용이 비어 있으면 자동 저장하지 않고 확인을 받아요
function unusual(p){
  if (!p.desc) return '내용이 비어 있어요';
  if (p.type === '지출' && p.amount >= 1000000) return won(p.amount) + '원은 큰 금액이에요';
  var since = ymd(new Date(Date.now() - 120 * 864e5));
  var past = visTx().filter(function(t){ return t.category === p.category && t.type === p.type && t.date >= since && t.who !== '자동'; }).map(function(t){ return t.amount; }).sort(function(a, b){ return a - b; });
  if (past.length >= 3 && p.amount >= 50000) { var med = past[Math.floor(past.length / 2)]; if (p.amount > med * 4) return p.category + ' 평소 금액(' + won(med) + '원)보다 훨씬 커요'; }
  return '';
}
function startAuto(){
  cancelAuto();
  var odd = S.preview.map(unusual).filter(Boolean)[0];
  if (odd) { toast(odd + '. 잘못 들었을 수 있어서 자동 저장을 멈췄어요. 확인 후 저장을 눌러 주세요.', null, null, 5000); return; }
  if (S.preview.some(isDup)) { toast('이미 있는 내역과 겹칠 수 있어서 자동 저장을 멈췄어요. 확인 후 저장을 눌러 주세요.', null, null, 4000); return; }
  var box = $('#autoBox'); if (!box) return;
  var sec = 3;
  box.innerHTML = '<div class="auto"><span><b id="autoSec">' + sec + '</b>초 뒤 자동 저장</span><i style="--d:' + sec + 's"></i><button class="btn ghost sm" id="autoCancel" style="padding:6px 10px">취소</button></div>';
  $('#autoCancel').onclick = function(){ cancelAuto(); toast('자동 저장을 멈췄어요. 고친 뒤 저장을 눌러 주세요.'); };
  S.autoTimer = setInterval(function(){
    sec--; var el = $('#autoSec'); if (el) el.textContent = sec;
    if (sec <= 0) { cancelAuto(); if (S.preview.length && S.doSave) S.doSave(); }
  }, 1000);
}
function cancelAuto(){ if (S.autoTimer) { clearInterval(S.autoTimer); S.autoTimer = null; } var box = $('#autoBox'); if (box) box.innerHTML = ''; }

function monthNav(withRange){ return '<div class="mnav"><button data-mk="-1" aria-label="이전 달">‹</button><b>' + mLabel(S.month) + (withRange && periodRange(S.month) ? ' <span class="faint xs" style="font-weight:400">' + periodRange(S.month) + '</span>' : '') + '</b><button data-mk="1" aria-label="다음 달">›</button></div>'; }
function bindMonthNav(){ document.querySelectorAll('[data-mk]').forEach(function(b){ b.onclick = function(){ S.month = shiftMonth(S.month, +b.dataset.mk); render(); }; }); }

function calendarHTML(list){
  var p = S.month.split('-'), y = +p[0], m = +p[1];
  var first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  var byDay = {};
  list.forEach(function(t){ var d = +t.date.slice(8, 10); byDay[d] = byDay[d] || { e: 0, i: 0 }; if (t.type === '지출') byDay[d].e += t.amount; else if (t.type === '수입') byDay[d].i += t.amount; });
  var today = ymd(new Date());
  var h = '<div class="cal">' + '일월화수목금토'.split('').map(function(w, i){ return '<div class="h' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; }).join('');
  for (var k = 0; k < first; k++) h += '<div class="d out"></div>';
  for (var d = 1; d <= days; d++) {
    var key = S.month + '-' + pad(d), wd = (first + d - 1) % 7, b = byDay[d];
    var short = function(n){ return n >= 1e6 ? (n / 1e4).toFixed(0) + '만' : n >= 1e4 ? (n / 1e4).toFixed(1).replace(/\.0$/, '') + '만' : won(n); };
    h += '<button class="d' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + (key === today ? ' today' : '') + (S.selDay === key ? ' sel' : '') + '" data-day="' + key + '" aria-label="' + d + '일' + (b && b.e ? ' 지출 ' + won(b.e) + '원' : '') + '">' +
      '<span class="n">' + d + '</span>' + (b && b.e ? '<span class="e">' + short(b.e) + '</span>' : '') + (b && b.i ? '<span class="i">+' + short(b.i) + '</span>' : '') + '</button>';
  }
  return h + '</div>';
}
function listHTML(){
  var list = txOfCal(S.month);
  var who = ['전체'].concat(members()); if (list.some(function(t){ return t.who === '자동'; })) who.push('자동');
  var f = list.filter(function(t){
    if (S.ftype !== '전체' && t.type !== S.ftype) return false;
    if (S.fwho !== '전체' && t.who !== S.fwho) return false;
    if (S.q) { var q = S.q.toLowerCase(); if (masked(t)) return false; if ((t.desc + ' ' + t.category + ' ' + t.method + ' ' + t.memo).toLowerCase().indexOf(q) < 0) return false; }
    return true;
  }).sort(sortTx);
  var cal = S.lview === 'cal';
  if (cal && S.selDay && S.selDay.slice(0, 7) !== S.month) S.selDay = '';
  var shown = cal ? (S.selDay ? f.filter(function(t){ return t.date === S.selDay; }) : []) : f;
  var groups = {}; shown.forEach(function(t){ (groups[t.date] = groups[t.date] || []).push(t); });
  var body = Object.keys(groups).sort().reverse().map(function(d){
    var exp = sumBy(groups[d], '지출');
    return '<div class="day"><span>' + dLabel(d) + '</span><span class="num">' + (exp ? '-' + won(exp) : '') + '</span></div>' + groups[d].map(itemHTML).join('');
  }).join('');
  var tot = { e: sumBy(f, '지출'), i: sumBy(f, '수입'), s: sumBy(f, '저축') };
  return monthNav() +
    '<div class="seg" style="margin:4px 0 8px" role="tablist"><button data-lv="list" class="' + (cal ? '' : 'on') + '">목록</button><button data-lv="cal" class="' + (cal ? 'on' : '') + '">달력</button></div>' +
    '<div class="chips" style="margin-top:6px">' + ['전체'].concat(TYPES).map(function(t){ return '<button class="chip' + (S.ftype === t ? ' on' : '') + '" data-ft="' + t + '">' + t + '</button>'; }).join('') +
    '<span style="width:8px;flex:none"></span>' + who.map(function(w){ return '<button class="chip' + (S.fwho === w ? ' on' : '') + '" data-fw="' + esc(w) + '">' + (w === '전체' ? '모두' : esc(w)) + '</button>'; }).join('') + '</div>' +
    '<input class="inp" id="q" placeholder="검색 (내용·카테고리·메모)" value="' + esc(S.q) + '">' +
    '<div class="card"><div class="sumrow"><div><div class="k">지출</div><div class="v">' + won(tot.e) + '</div></div><div><div class="k">수입</div><div class="v amt-수입">' + won(tot.i) + '</div></div><div><div class="k">저축</div><div class="v amt-저축">' + won(tot.s) + '</div></div></div>' +
    (cal ? calendarHTML(f) : '') +
    '<div class="list">' + (body || (cal ? '<div class="empty">' + (S.selDay ? '이날은 내역이 없어요.' : '날짜를 누르면 그날 내역이 보여요.') + '</div>' : '<div class="empty">내역이 없어요.</div>')) + '</div></div>' +
    '<button class="btn pri block" id="addOne">+ 내역 추가</button>';
}

  bindMonthNav(); bindItems();
  document.querySelectorAll('[data-ft]').forEach(function(b){ b.onclick = function(){ S.ftype = b.dataset.ft; render(); }; });
  document.querySelectorAll('[data-fw]').forEach(function(b){ b.onclick = function(){ S.fwho = b.dataset.fw; render(); }; });
  var q = $('#q'), tm; q.oninput = function(){ clearTimeout(tm); tm = setTimeout(function(){ S.q = q.value; var pos = q.selectionStart; render(); var nq = $('#q'); nq.focus(); try{ nq.setSelectionRange(pos, pos); }catch(e){} }, 300); };
  $('#addOne').onclick = function(){ openEdit(null, S.lview === 'cal' && S.selDay ? { date: S.selDay } : null); };
  document.querySelectorAll('[data-lv]').forEach(function(b){ b.onclick = function(){ S.lview = b.dataset.lv; LS.set('lview', S.lview); render(); }; });

/* ---------- 입력·수정 시트 ---------- */
function openEdit(t, prefill){

  var e = t ? JSON.parse(JSON.stringify(t)) : { id: uid(), date: S.view === 'list' && S.month !== curM() ? period(S.month).from : ymd(new Date()), type: '지출', category: '', amount: 0, desc: '', method: LS.get('lastMethod', '') || methods()[0] || '', who: S.me, memo: '', scope: isKid() ? '개인' : '공용' };
  if (!e.scope) e.scope = '공용';
  if (prefill) Object.keys(prefill).forEach(function(k){ if (prefill[k]) e[k] = prefill[k]; });

      '<div class="seg" style="margin-top:12px">' + TYPES.map(function(x){ return '<button data-ty="' + x + '" class="' + (x === e.type ? 'on' : '') + '">' + x + '</button>'; }).join('') + '</div>' +
      '<div class="fld"><label>금액 (원)</label><input class="inp amtbig num" id="eAmt" inputmode="numeric" value="' + (e.amount ? won(e.amount) : '') + '" placeholder="0"></div>' +
      '<div class="fld"><label>카테고리</label><div class="grid">' + cats(e.type).map(function(c){ return '<button class="chip' + (c.name === e.category ? ' on' : '') + '" data-ca="' + esc(c.name) + '">' + icon(c.name) + ' ' + esc(c.name) + '</button>'; }).join('') + '</div></div>' +
      '<div class="fld"><label>내용</label><input class="inp" id="eDesc" value="' + esc(e.desc) + '" placeholder="예) 김밥천국"></div>' +
      '<div class="row" style="gap:8px"><div class="fld grow"><label>날짜</label><input class="inp" type="date" id="eDate" value="' + e.date + '"></div>' +
      '</div><div class="fld"><label>결제수단</label><div class="chips">' + methodsSorted().map(function(m){ var pi = payInfo(m); return '<button class="chip paychip' + (m === e.method ? ' on' : '') + '" data-pm="' + esc(m) + '" style="' + (m === e.method ? 'background:' + esc(pi.color) + ';border-color:' + esc(pi.color) + ';color:#fff' : '') + '">' + payDot(m) + esc(m) + (pi.owner && pi.owner !== S.me ? '<small> · ' + esc(pi.owner) + '</small>' : '') + '</button>'; }).join('') + '<button class="chip' + (!e.method ? ' on' : '') + '" data-pm="">없음</button></div></div>' +
      (cardOf(e.method) && cardOf(e.method).target ? '<div class="faint xs" style="margin-top:-6px">💳 ' + esc(e.method) + ' 이번 달 실적 ' + won(cardUse(cardOf(e.method)).sum) + ' / ' + won(cardOf(e.method).target) + '원</div>' : '') +
      '<div class="row" style="gap:8px"><div class="fld grow"><label>입력자</label><select class="inp" id="eWho">' + members().concat(e.who && members().indexOf(e.who) < 0 ? [e.who] : []).map(function(m){ return '<option' + (m === e.who ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select></div>' +
      '<div class="fld grow"><label>메모</label><input class="inp" id="eMemo" value="' + esc(e.memo) + '"></div></div>' +
      (isNew && e.type === '지출' ? '<div class="fld"><label>할부</label><select class="inp" id="eInst">' + [1, 2, 3, 4, 5, 6, 10, 12, 18, 24].map(function(n){ return '<option value="' + n + '"' + (n === (e.inst || 1) ? ' selected' : '') + '>' + (n === 1 ? '일시불' : n + '개월') + '</option>'; }).join('') + '</select>' +
        (e.inst > 1 && e.amount ? '<div class="faint xs" style="margin-top:4px">매달 약 ' + won(Math.floor(e.amount / e.inst)) + '원씩 ' + e.inst + '번, 결제한 날과 같은 날짜로 기록돼요. 나중에 회차 하나를 지우면 그 뒤 회차도 함께 지워져요</div>' : '') + '</div>' : '') +
      (e.type === '지출' ? '<div class="fld"><label>누구 돈으로 썼나요?</label><div class="seg">' + [['공용', '가족 공용'], ['개인', '개인 용돈']].map(function(o){ return '<button data-sc="' + o[0] + '" class="' + (o[0] === e.scope ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div></div>' : '') +
      '<div class="row" style="margin-top:8px">' + (isNew ? '' : '<button class="btn danger" id="eDel">삭제</button>') + '<button class="btn pri grow" id="eSave">저장</button></div>';
    sh.querySelectorAll('[data-ty]').forEach(function(b){ b.onclick = function(){ pull(); e.type = b.dataset.ty; var c = cats(e.type); e.category = (c[0] || {}).name || ''; catTouched = true; draw(); }; });
    sh.querySelectorAll('[data-ca]').forEach(function(b){ b.onclick = function(){ pull(); e.category = b.dataset.ca; catTouched = true; draw(); }; });
    sh.querySelectorAll('[data-sc]').forEach(function(b){ b.onclick = function(){ pull(); e.scope = b.dataset.sc; draw(); }; });
    var ei = $('#eInst'); if (ei) ei.onchange = function(){ pull(); draw(); };
    sh.querySelectorAll('[data-pm]').forEach(function(b){ b.onclick = function(){ pull(); e.method = b.dataset.pm; draw(); }; });
    $('#eDesc').onchange = function(){
      if (catTouched || !isNew) return;

      var g = Parser.guessCategory(e.desc, e.desc, cats(), history());
      var sc = Parser.detectScope(e.desc); if (sc) e.scope = sc;
      if (g.category && (g.category !== e.category || g.type !== e.type) || sc) {
        if (g.category) { e.type = g.type; e.category = g.category; }
        // 다른 칸으로 옮겨 가는 중이면 다시 그린 뒤에도 그 칸에 커서를 둬요
        setTimeout(function(){ var fid = document.activeElement && document.activeElement.id; pull(); draw(); var f = fid && document.getElementById(fid); if (f) f.focus(); }, 0);
      }
    };
    $('#eClose').onclick = closeSheet;
    $('#eAmt').onblur = function(){ var v = digits(this.value); this.value = v ? won(v) : ''; };
    $('#eSave').onclick = function(){
      pull();
      if (!e.amount) return toast('금액을 입력해 주세요.');

        var n = e.inst, each = Math.floor(e.amount / n), first = e.amount - each * (n - 1), gid = uid(), items = [];
        var d0 = new Date(e.date + 'T00:00:00');
        for (var k = 0; k < n; k++) {
          var lastD = new Date(d0.getFullYear(), d0.getMonth() + k + 1, 0).getDate();
          var dk = new Date(d0.getFullYear(), d0.getMonth() + k, Math.min(d0.getDate(), lastD));
          items.push({ id: gid + '-' + (k + 1), date: ymd(dk), type: '지출', category: e.category, amount: k ? each : first, desc: e.desc, method: e.method, who: e.who, scope: e.scope,
            memo: '할부 ' + (k + 1) + '/' + n + ' · 총 ' + won(e.amount) + '원' + (e.memo ? ' · ' + e.memo : '') });
        }
        var svI = saveItems(items); render();
        if (svI) { haptic(); toast((e.desc || e.category) + ' ' + won(e.amount) + '원을 ' + n + '개월 할부로 나눠 기록했어요', '실행 취소', function(){ undoSave(svI); }, 6000); }
      }
      else if (isNew) { var sv = saveItems([e]); render(); if (sv) announceSaved(sv); }
      else {
        var old = S.data.tx.filter(function(x){ return x.id === e.id; })[0];
        S.data.tx = S.data.tx.map(function(x){ return x.id === e.id ? e : x; });
        queue({ op: 'update', tx: e }); haptic(); render();
        toast('수정했어요', '되돌리기', function(){ if (!old) return; S.data.tx = S.data.tx.map(function(x){ return x.id === old.id ? old : x; }); queue({ op: 'update', tx: old }); render(); toast('수정을 되돌렸어요'); });
      }
    };
    var del = $('#eDel'); if (del) del.onclick = function(){
      if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = '정말 삭제'; return; }
      var gm = /^(.+)-\d+$/.exec(e.id), grp = instOf(e) && gm ? S.data.tx.filter(function(x){ return x.id.indexOf(gm[1] + '-') === 0 && x.date >= e.date; }) : [];

        S.data.tx = S.data.tx.filter(function(x){ return grp.indexOf(x) < 0; });
        grp.forEach(function(x){ queue({ op: 'delete', id: x.id }); }); haptic(); closeSheet(); render();
        return toast('남은 할부 ' + grp.length + '건을 함께 삭제했어요', '실행 취소', function(){ grp.forEach(function(x){ S.data.tx.push(x); }); queue({ op: 'add', items: grp }); render(); toast('삭제를 취소했어요'); });
      }
