<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>우리집 가계부</title>
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<style>
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#1C1B19; --ink2:#5F5C55; --ink3:#9A968C; --line:#E7E4DC;
  --pri:#0F766E; --pri-ink:#FFFFFF; --pri-soft:#E2F1EE; --exp:#1C1B19; --inc:#2459C9; --sav:#0F7A3D;
  --warn:#B45309; --warn-soft:#FDF0DC; --bad:#C2410C; --bad-soft:#FCE6DB; --chip:#F0EEE8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04); --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141413; --card:#1F1E1C; --ink:#F2F0EA; --ink2:#B9B5AB; --ink3:#7E7A71; --line:#2E2C29;
    --pri:#2DD4BF; --pri-ink:#062A26; --pri-soft:#143430; --exp:#F2F0EA; --inc:#7FA7FF; --sav:#5BD08A;
    --warn:#F5B556; --warn-soft:#3A2D16; --bad:#FF8A5C; --bad-soft:#3D2117; --chip:#2A2926; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px}
.sync{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sav)}
.dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .sm{font-size:13px} .xs{font-size:12px}
.big{font-size:28px;font-weight:750;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin:10px 0 8px}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:8px;transition:width .3s}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
textarea.say{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:12px;padding:12px 44px 12px 12px;background:var(--bg);resize:none;outline:none}
textarea.say:focus{border-color:var(--pri)}
.saybox{position:relative}
.voice{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.micbig{flex:none;width:76px;height:76px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,118,110,.28);cursor:pointer;position:relative}
.micbig svg{width:34px;height:34px}
.micbig.rec{background:var(--bad);box-shadow:0 0 0 0 rgba(194,65,12,.5);animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(194,65,12,.45)}70%{box-shadow:0 0 0 18px rgba(194,65,12,0)}100%{box-shadow:0 0 0 0 rgba(194,65,12,0)}}
.micbig.hint{animation:hint 1.6s infinite}
@keyframes hint{50%{transform:scale(1.06)}}
.vt{min-width:0;flex:1}
.vt b{display:block;font-size:16px}
.vt span{display:block;font-size:13px;color:var(--ink3);word-break:keep-all}
.vt .live{color:var(--ink);font-size:15px;font-weight:600}
.auto{display:flex;align-items:center;gap:10px;background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.auto i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.auto i::after{content:"";position:absolute;inset:0;background:var(--pri);transform-origin:left;animation:shrink var(--d,3s) linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-of-type{border-bottom:0}
.toggle input{width:44px;height:26px;accent-color:var(--pri)}
@media (prefers-reduced-motion: reduce){.micbig.rec,.micbig.hint{animation:none}}
.mic{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--pri);display:none;align-items:center;justify-content:center;font-size:18px}
.mic.on{display:flex} .mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--chip);cursor:pointer}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.pv{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.pv input,.pv select{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;min-width:0}
.pv input:focus,.pv select:focus{border-color:var(--line);background:var(--card);outline:none}
.pv .amt{width:120px;text-align:right;font-weight:700}
.pv .desc{flex:1;font-weight:600}
.pv .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{background:var(--chip);border-radius:999px;padding:4px 10px !important;font-size:13px !important;border:0 !important}
.pill.t-수입{background:#E3ECFF;color:var(--inc)} .pill.t-저축{background:#DFF3E6;color:var(--sav)}
@media (prefers-color-scheme: dark){ .pill.t-수입{background:#1C2840} .pill.t-저축{background:#16301F} }
.x{border:0;background:transparent;color:var(--ink3);font-size:18px;padding:0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list .day{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:14px 2px 6px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt-지출{color:var(--exp)} .amt-수입{color:var(--inc)} .amt-저축{color:var(--sav)}
.item .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink3);padding:4px 14px}
.nav button b{font-size:20px;font-weight:400;line-height:1.1}
.nav button.on{color:var(--pri);font-weight:700}
.mnav{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0}
.mnav button{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:16px}
.mnav b{font-size:17px;min-width:120px;text-align:center}
.sumrow{display:flex;gap:8px}
.sumrow>div{flex:1;background:var(--bg);border-radius:12px;padding:10px}
.sumrow .k{font-size:12px;color:var(--ink3)} .sumrow .v{font-weight:700;font-variant-numeric:tabular-nums}
.cat{padding:10px 0;border-bottom:1px solid var(--line)} .cat:last-child{border-bottom:0}
.cat .bar{margin:6px 0 0;height:6px}
.trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.trend .b{width:100%;max-width:34px;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:2px}
.trend .b.cur{background:var(--ink)}
.trend .l{font-size:11.5px;color:var(--ink3)} .trend .v{font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.fld{margin:12px 0}
.fld label{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);outline:none}
.inp:focus{border-color:var(--pri)}
.inp.amtbig{font-size:24px;font-weight:750;text-align:right}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid .chip{font-size:13.5px}
.empty{text-align:center;color:var(--ink3);padding:28px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.gate{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.gate h2{margin:6px 0 6px;font-size:22px}
.pin{font-size:28px;letter-spacing:10px;text-align:center;width:220px;margin:18px 0}
.set-row{display:grid;grid-template-columns:70px 1fr 96px 28px;gap:6px;align-items:center;margin:6px 0}
.set-row input,.set-row select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--bg);width:100%;font-size:14px;min-width:0}
.set-row .kw{grid-column:1 / -1;font-size:12.5px;color:var(--ink2)}
.rec-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.rec-row input,.rec-row select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--bg);width:100%;font-size:14px;min-width:0}
h3{font-size:15px;margin:0 0 8px}
.hidden{display:none !important}
.tip{background:var(--pri-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.loading{padding:40px 0;text-align:center;color:var(--ink3)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:4px;vertical-align:1px}
</style>
</head>
<body>
<div id="gate" class="gate hidden"></div>
<div id="app" class="hidden">
  <div class="wrap">
    <div class="top">
      <h1 id="title">우리집 가계부</h1>
      <div class="sync" id="sync"><span class="dot"></span><span>동기화됨</span></div>
    </div>
    <div id="view"></div>
  </div>
  <nav class="nav">
    <button data-v="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>입력</button>
    <button data-v="list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>내역</button>
    <button data-v="stats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10Z"/></svg>통계</button>
    <button data-v="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>설정</button>
  </nav>
</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* 한국어 지출 문장 파서: "어제 점심 김밥천국 8천원, 커피 4500원 카드" → 항목 배열 */
var Parser = (function () {
  var HDIG = { '영': 0, '공': 0, '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '칠': 7, '팔': 8, '구': 9 };
  var SMALL = { '십': 10, '백': 100, '천': 1000 };
  var BIG = { '만': 1e4, '억': 1e8 };
  var COUNTERS = '월일시분개명번층호살세잔병권장회박인캔봉벌켤대등위퍼%';

  function koNum(s) {
    s = String(s).replace(/[\s,원]/g, '');
    var total = 0, section = 0, buf = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (/[0-9.]/.test(ch)) buf += ch;
      else if (ch in HDIG) buf += String(HDIG[ch]);
      else if (ch in SMALL) { section += (buf ? parseFloat(buf) : 1) * SMALL[ch]; buf = ''; }
      else if (ch in BIG) { section += buf ? parseFloat(buf) : 0; total += (section || 1) * BIG[ch]; section = 0; buf = ''; }
    }
    section += buf ? parseFloat(buf) : 0;
    return Math.round(total + section);
  }

  var RE_DIGIT = /\d[\d,]*(?:\.\d+)?(?:\s?[십백천만억](?:\s?\d[\d,]*(?:\.\d+)?)?)*(?:\s?원)?/g;
  var RE_HAN = /(^|[^가-힣0-9.,])([일이삼사오육칠팔구십백천만억](?:\s?[일이삼사오육칠팔구십백천만억]|[0-9,])*\s?원)/g;

  function findAmounts(text) {
    var res = [], m;
    function overlaps(st, en) { return res.some(function (r) { return st < r.end && en > r.start; }); }
    RE_HAN.lastIndex = 0;
    while ((m = RE_HAN.exec(text))) {
      var st = m.index + m[1].length, en = st + m[2].length;
      var v2 = koNum(m[2]);
      if (v2 > 0) res.push({ start: st, end: en, value: v2 });
    }
    RE_DIGIT.lastIndex = 0;
    while ((m = RE_DIGIT.exec(text))) {
      var raw = m[0].replace(/\s+$/, '');
      var s0 = m.index, e0 = m.index + raw.length;
      if (overlaps(s0, e0)) continue;
      var next = text.charAt(e0);
      var hasUnit = /[십백천만억원]/.test(raw);
      if (!hasUnit && next && COUNTERS.indexOf(next) >= 0) continue;
      if (!hasUnit && /^\s*(년|월|일)/.test(text.slice(e0))) continue;
      var v = koNum(raw);
      if (!hasUnit && v < 100) continue;
      if (v <= 0) continue;
      res.push({ start: s0, end: e0, value: v });
    }
    return res.sort(function (a, b) { return a.start - b.start; });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  var WD = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
  var RE_DATE = /(오늘|어제|그제|그저께|엊그제|(\d{1,2})\s?월\s?(\d{1,2})\s?일|(\d{1,2})\s?일(?![가-힣])|(지난\s?주\s?)?([월화수목금토일])요일)/g;

  function findDates(text, today) {
    var res = [], m;
    RE_DATE.lastIndex = 0;
    while ((m = RE_DATE.exec(text))) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      var w = m[1];
      if (w === '오늘') { }
      else if (w === '어제') d.setDate(d.getDate() - 1);
      else if (w === '그제' || w === '그저께' || w === '엊그제') d.setDate(d.getDate() - 2);
      else if (m[2]) {
        d = new Date(today.getFullYear(), Number(m[2]) - 1, Number(m[3]));
        if (d > today) d.setFullYear(d.getFullYear() - 1);
      } else if (m[4]) {
        var day = Number(m[4]);
        if (day < 1 || day > 31) continue;
        d = new Date(today.getFullYear(), today.getMonth(), day);
        if (d > today) d = new Date(today.getFullYear(), today.getMonth() - 1, day);
      } else if (m[6]) {
        if (m[5]) {
          var mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7);
          d = new Date(mon); d.setDate(mon.getDate() + ((WD[m[6]] + 6) % 7));
        } else {
          d.setDate(d.getDate() - ((d.getDay() - WD[m[6]] + 7) % 7));
        }
      }
      res.push({ start: m.index, end: m.index + m[0].length, date: ymd(d) });
    }
    return res;
  }

  var METHOD_WORDS = [
    { re: /체크\s?카드|체크/, key: '체크' },
    { re: /신용\s?카드|카드\s?로|카드\s?결제|카드/, key: '카드' },
    { re: /현금/, key: '현금' },
    { re: /계좌\s?이체|이체|송금|토스로|토스/, key: '이체' },
    { re: /페이|삼성페이|애플페이|카카오페이|네이버페이/, key: '페이' }
  ];

  function matchMethod(seg, methods) {
    for (var i = 0; i < METHOD_WORDS.length; i++) {
      var mm = seg.match(METHOD_WORDS[i].re);
      if (!mm) continue;
      var key = METHOD_WORDS[i].key, found = null;
      methods.forEach(function (x) {
        if (found) return;
        if (key === '체크' && /체크/.test(x)) found = x;
        else if (key === '카드' && /카드/.test(x) && !/체크/.test(x)) found = x;
        else if (key === '현금' && /현금/.test(x)) found = x;
        else if (key === '이체' && /이체|송금|계좌/.test(x)) found = x;
        else if (key === '페이' && /페이/.test(x)) found = x;
      });
      if (!found && key === '페이') methods.forEach(function (x) { if (!found && /카드/.test(x) && !/체크/.test(x)) found = x; });
      if (found) return { method: found, word: mm[0] };
    }
    return null;
  }

  var FILLER = /(썼어요|썼어|썼음|썼다|씀|사용했어요|사용했어|사용|결제했어요|결제했어|결제함|결제|지출했어|지출|구매했어|구매|샀어요|샀어|샀음|냈어요|냈어|냈음|나갔어|들어왔어요|들어왔어|들어옴|받았어요|받았어|받음|입금됐어|입금|그리고|그다음|정도|쯤|약|총|에다가)/g;
  var INCOME_HINT = /(들어왔|들어옴|받았|받음|입금|월급|급여|보너스|상여|환급)/;
  var SAVE_HINT = /(적금|저축|예금|청약|연금저축|IRP|ISA|비상금)/i;

  function cleanDesc(s) {
    s = s.replace(FILLER, ' ');
    s = s.replace(/[,.!?·~]+/g, ' ');
    var toks = s.split(/\s+/).filter(Boolean).map(function (t) {
      if (t.length > 2) t = t.replace(/(에서는|에서|이랑|하고|으로)$/, '');
      if (t.length > 1) t = t.replace(/(에|을|를|랑|은|는)$/, '');
      return t;
    }).filter(function (t) { return t && !/^(원|랑|하고|에|에서|로|으로|은|는|이|가)$/.test(t); });
    return toks.join(' ').trim();
  }

  function guessCategory(desc, seg, cats, history) {
    var key = desc.replace(/\s+/g, '');
    if (key && history && history[key]) {
      var h = history[key];
      if (cats.some(function (c) { return c.name === h.category && c.type === h.type; })) return { type: h.type, category: h.category, learned: true };
    }
    var hay = (seg + ' ' + desc).toLowerCase();
    var best = null, bestLen = 0;
    cats.forEach(function (c) {
      String(c.keywords || '').split(',').forEach(function (k) {
        k = k.trim().toLowerCase();
        if (k && hay.indexOf(k) >= 0 && k.length > bestLen) { best = c; bestLen = k.length; }
      });
      var nm = c.name.toLowerCase();
      if (!best && hay.indexOf(nm) >= 0) { best = c; bestLen = nm.length; }
    });
    if (best) return { type: best.type, category: best.name };
    var type = INCOME_HINT.test(seg) ? '수입' : SAVE_HINT.test(seg) ? '저축' : '지출';
    var fallback = cats.filter(function (c) { return c.type === type; });
    var etc = fallback.filter(function (c) { return /기타/.test(c.name); })[0] || fallback[fallback.length - 1];
    return { type: type, category: etc ? etc.name : '' };
  }

  /**
   * opts: { today: Date, cats: [...], methods: [...], history: {descKey: {type, category, method}}, defaultMethod }
   */
  function parse(text, opts) {
    opts = opts || {};
    var today = opts.today || new Date();
    var cats = opts.cats || [], methods = opts.methods || [];
    text = String(text || '').replace(/ /g, ' ');
    var amts = findAmounts(text);
    if (!amts.length) return [];
    var dates = findDates(text, today);
    var items = [];
    var prevEnd = 0;
    var globalDate = dates.length ? dates[0].date : ymd(today);
    var globalMethod = matchMethod(text, methods);
    for (var i = 0; i < amts.length; i++) {
      var a = amts[i];
      var nextStart = i + 1 < amts.length ? amts[i + 1].start : text.length;
      var before = text.slice(prevEnd, a.start);
      var after = text.slice(a.end, nextStart);
      var useAfter = !cleanDesc(stripDates(before)).replace(/\s/g, '') ;
      var seg = useAfter ? after : before;
      if (!useAfter && i === amts.length - 1) seg = before + ' ' + after; // 마지막 항목 뒤의 "카드로" 같은 말 포함
      var segStart = useAfter ? a.end : prevEnd;
      var segEnd = useAfter ? nextStart : (i === amts.length - 1 ? text.length : a.start);
      var date = null;
      dates.forEach(function (d) { if (!date && d.start >= segStart && d.end <= segEnd) date = d.date; });
      var mm = matchMethod(seg, methods) || globalMethod;
      var descSrc = stripDates(seg);
      if (mm) descSrc = descSrc.replace(mm.word, ' ');
      var desc = cleanDesc(descSrc);
      var g = guessCategory(desc, seg, cats, opts.history);
      var hist = opts.history && opts.history[desc.replace(/\s+/g, '')];
      items.push({
        date: date || globalDate,
        type: g.type,
        category: g.category,
        amount: a.value,
        desc: desc,
        method: mm ? mm.method : (hist && hist.method) || (g.type !== '지출' ? (methods.filter(function (x) { return /이체|계좌/.test(x); })[0] || '') : (opts.defaultMethod || methods[0] || '')),
        learned: !!g.learned
      });
      prevEnd = useAfter ? nextStart : a.end;
    }
    return items;
  }

  function stripDates(s) {
    return s.replace(RE_DATE, ' ');
  }

  return { parse: parse, guessCategory: guessCategory, koNum: koNum, findAmounts: findAmounts, findDates: findDates, ymd: ymd };
})();

/* ---------- 유틸 ---------- */
function $(s, el){ return (el || document).querySelector(s); }

function mLabel(m){ var p = m.split('-'); return p[0] + '년 ' + (+p[1]) + '월'; }

  var w = '일월화수목금토'[d.getDay()]; var base = (+p[1]) + '월 ' + (+p[2]) + '일 (' + w + ')';
  if (s === ymd(t)) return '오늘 · ' + base; if (s === ymd(y)) return '어제 · ' + base; return base; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function digits(v){ v = String(v || '').trim(); if (!v) return 0; if (/[십백천만억]/.test(v)) return Parser.koNum(v); return Number(v.replace(/[^\d.-]/g, '')) || 0; }

/* ---------- 서버 호출 ---------- */
function call(action, payload){
  if (!window.API_URL || /여기에/.test(window.API_URL)) return Promise.reject(Object.assign(new Error('앱 설정(config.js)에 서버 주소가 없어요.'), { code: 'CONFIG' }));
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = setTimeout(function(){ if (ctl) ctl.abort(); }, 25000);
  return fetch(window.API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ pin: S.pin, action: action, payload: payload || {} }), signal: ctl ? ctl.signal : undefined })
    .then(function(r){ clearTimeout(tm); return r.text(); }, function(){ clearTimeout(tm); throw Object.assign(new Error('network'), { code: 'NET' }); })
    .then(function(t){
      var o; try{ o = JSON.parse(t); }catch(e){ throw Object.assign(new Error('서버 응답을 읽지 못했어요. 웹 앱 배포 설정(모든 사용자)을 확인해 주세요.'), { code: 'BAD' }); }
      if (o && o.error) throw Object.assign(new Error(o.message || o.error), { code: o.error });
      return o;
    });
}

function setSync(state, text){
  var el = $('#sync'); if (!el) return;
  el.innerHTML = '<span class="dot ' + (state === 'ok' ? '' : state) + '"></span><span>' + esc(text) + '</span>';

function refreshSyncLabel(){
  if (S.pending.length) setSync('wait', '전송 대기 ' + S.pending.length + '건');
  else if (!S.online) setSync('off', '오프라인');
  else setSync('ok', '동기화됨');
}

function load(silent){
  if (!silent) setSync('wait', '불러오는 중');
  return call('load', { months: 13 }).then(function(d){
    S.online = true;
    var pendIds = {};
    S.pending.forEach(function(op){ if (op.op === 'add') op.items.forEach(function(t){ pendIds[t.id] = t; }); });
    var serverIds = {};
    d.tx.forEach(function(t){ serverIds[t.id] = 1; });
    Object.keys(pendIds).forEach(function(id){ if (!serverIds[id]) d.tx.push(pendIds[id]); });
    S.pending.forEach(function(op){
      if (op.op === 'delete') d.tx = d.tx.filter(function(t){ return t.id !== op.id; });
      if (op.op === 'update') d.tx = d.tx.map(function(t){ return t.id === op.tx.id ? op.tx : t; });
    });
    S.data = d; LS.set('cache', d);
    refreshSyncLabel();
    if (!S.me && d.cfg.members.length) return showWho();
    if (S.view === 'home' && S.draft && $('#say')) { refreshSyncLabel(); return; }
    render();
  }).catch(function(e){
    if (e && e.code === 'PIN') { S.pin = ''; LS.del('pin'); return showGate(); }
    S.online = false; refreshSyncLabel();
    if (!S.data) { $('#view').innerHTML = '<div class="empty">연결할 수 없어요. 인터넷 연결을 확인해 주세요.</div>'; }
  });
}

function flush(){
  if (S.flushing || !S.pending.length) { refreshSyncLabel(); return Promise.resolve(); }
  S.flushing = true;
  var op = S.pending[0];
  var p = op.op === 'add' ? call('add', { items: op.items }) : op.op === 'update' ? call('update', { tx: op.tx }) : call('delete', { id: op.id });
  return p.then(function(){
    S.pending.shift(); LS.set('pending', S.pending); S.flushing = false; S.online = true;
    if (S.pending.length) return flush();
    refreshSyncLabel();
  }).catch(function(e){
    S.flushing = false;
    if (e && e.code && e.code !== 'NET' && e.code !== 'BAD' && e.code !== 'CONFIG') {
      // 서버가 거절한 요청은 버림(예: 이미 지워진 내역)
      S.pending.shift(); LS.set('pending', S.pending); toast('저장 실패: ' + e.message);
      if (S.pending.length) return flush();
    } else { S.online = false; }
    refreshSyncLabel();
  });
}

function queue(op){ S.pending.push(op); LS.set('pending', S.pending); LS.set('cache', S.data); refreshSyncLabel(); flush(); }

/* ---------- 데이터 헬퍼 ---------- */
function cats(type){ return (S.data ? S.data.cats : []).filter(function(c){ return !type || c.type === type; }); }
function methods(){ return S.data ? S.data.cfg.methods : []; }
function members(){ return S.data ? S.data.cfg.members : []; }
function txOfMonth(m){ return (S.data ? S.data.tx : []).filter(function(t){ return t.date.slice(0, 7) === m; }); }
function sumBy(list, type){ return list.reduce(function(s, t){ return s + (t.type === type ? t.amount : 0); }, 0); }
function history(){

  (S.data ? S.data.tx : []).slice().sort(function(a, b){ return (a.created || '') < (b.created || '') ? -1 : 1; }).forEach(function(t){

function summaryCard(m){
  var list = txOfMonth(m), exp = sumBy(list, '지출'), inc = sumBy(list, '수입'), sav = sumBy(list, '저축');

    '<div class="big">' + won(exp) + '<span style="font-size:17px;font-weight:600"> 원</span></div>' +
    (bud ? '<div class="bar"><i class="' + cls + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i></div>' +
      '<div class="sm ' + (remain < 0 ? '' : 'muted') + '" style="' + (remain < 0 ? 'color:var(--bad)' : '') + '">' +
      (remain >= 0 ? '남은 예산 <b class="num">' + won(remain) + '원</b>' + (isCur && left > 0 ? ' · 하루 <b class="num">' + won(remain / left) + '원</b>씩 쓸 수 있어요 (' + left + '일 남음)' : '') : '예산을 <b class="num">' + won(-remain) + '원</b> 넘었어요') + '</div>' : '') +
    '<div class="sumrow" style="margin-top:12px"><div><div class="k">수입</div><div class="v amt-수입">' + won(inc) + '</div></div><div><div class="k">저축·투자</div><div class="v amt-저축">' + won(sav) + '</div></div><div><div class="k">남은 돈</div><div class="v">' + won(inc - exp - sav) + '</div></div></div>' +

}

function homeHTML(){
  var recent = (S.data.tx || []).slice().sort(sortTx).slice(0, 6);
  return summaryCard(ym(new Date())) +
    '<div class="card">' +
      '<div class="row between" style="margin-bottom:8px"><h3 style="margin:0">어디에 얼마 썼나요?</h3><span class="faint xs">' + esc(S.me || '') + '</span></div>' +
      (SR ? '<div class="voice"><button class="micbig" id="micBig" aria-label="말로 입력">' + MIC_SVG + '</button><div class="vt" id="vt"><b>눌러서 말하기</b><span>예) 점심 김밥천국 8천원, 커피 4500원</span></div></div>' : '') +
      '<div class="saybox"><textarea id="say" class="say" rows="2" placeholder="' + (SR ? '또는 여기에 쓰기' : '예) 점심 김밥천국 8천원, 커피 4500원') + '">' + esc(S.draft) + '</textarea></div>' +
      (SR ? '' : '<div class="faint xs" style="margin-top:6px">이 브라우저는 앱 안 녹음을 지원하지 않아요. 키보드의 🎤 버튼을 쓰거나' + (isIOS() ? ' 아이폰 단축어 아이콘을 써 보세요.' : ' Chrome으로 열어 주세요.') + '</div>') +
      '<div id="autoBox"></div>' +
      '<div id="pv"></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn ghost" id="manual">직접 입력</button><button class="btn pri grow" id="saveAll" disabled>저장</button></div>' +
    '</div>' +
    '<div class="card"><div class="row between"><h3 style="margin:0">최근 내역</h3><button class="btn ghost sm" style="padding:6px 10px" id="seeAll">전체 보기</button></div>' +
      '<div class="list">' + (recent.length ? recent.map(itemHTML).join('') : '<div class="empty">아직 내역이 없어요. 위에 첫 지출을 입력해 보세요.</div>') + '</div></div>';
}

function sortTx(a, b){ if (a.date !== b.date) return a.date < b.date ? 1 : -1; return (a.created || '') < (b.created || '') ? 1 : -1; }

function itemHTML(t){
  var sign = t.type === '지출' ? '-' : t.type === '수입' ? '+' : '';
  var sub = [t.category, t.method, t.who].filter(Boolean).join(' · ');
  return '<div class="item" data-id="' + esc(t.id) + '"><div class="ico">' + icon(t.category) + '</div><div class="grow"><div class="t">' + esc(t.desc || t.category) + '</div><div class="s">' + esc(sub) + '</div></div><div class="a amt-' + t.type + '">' + sign + won(t.amount) + '</div></div>';
}

function catOptions(type, sel){
  var list = cats(type); var html = list.map(function(c){ return '<option' + (c.name === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
  if (sel && !list.some(function(c){ return c.name === sel; })) html = '<option selected>' + esc(sel) + '</option>' + html;
  return html;
}
function methodOptions(sel){ var ms = methods(); var h = '<option value=""' + (!sel ? ' selected' : '') + '>결제수단 없음</option>'; return h + ms.map(function(m){ return '<option' + (m === sel ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join(''); }

function previewHTML(){
  if (!S.preview.length) return S.draft.trim() ? '<div class="faint sm" style="margin-top:10px">금액을 찾지 못했어요. “8천원”, “4500원”처럼 금액을 넣어 주세요.</div>' : '';
  return S.preview.map(function(p, i){
    return '<div class="pv" data-i="' + i + '">' +
      '<div class="row"><span class="ico" style="width:30px;height:30px;font-size:16px;border-radius:9px">' + icon(p.category) + '</span>' +
      '<input class="desc" data-f="desc" value="' + esc(p.desc) + '" placeholder="내용">' +
      '<input class="amt num" data-f="amount" inputmode="numeric" value="' + won(p.amount) + '"><button class="x" data-del="' + i + '">×</button></div>' +
      '<div class="meta"><select class="pill t-' + p.type + '" data-f="type">' + TYPES.map(function(t){ return '<option' + (t === p.type ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
      '<select class="pill" data-f="category">' + catOptions(p.type, p.category) + '</select>' +
      '<input class="pill" type="date" data-f="date" value="' + p.date + '">' +
      '<select class="pill" data-f="method">' + methodOptions(p.method) + '</select>' + (p.learned ? '<span class="faint xs" style="align-self:center">지난번 분류</span>' : '') + '</div></div>';
  }).join('');
}

function reparse(){
  S.preview = Parser.parse(S.draft, { today: new Date(), cats: cats(), methods: methods(), history: history(), defaultMethod: LS.get('lastMethod', '') });
  $('#pv').innerHTML = previewHTML(); bindPreview();
  $('#saveAll').disabled = !S.preview.length;
  $('#saveAll').textContent = S.preview.length > 1 ? S.preview.length + '건 저장' : '저장';
}

function bindPreview(){
  document.querySelectorAll('.pv').forEach(function(row){
    var i = +row.dataset.i;
    row.querySelectorAll('[data-f]').forEach(function(el){
      el.onfocus = cancelAuto;
      el.onchange = function(){
        var f = el.dataset.f, p = S.preview[i];
        if (f === 'amount') { p.amount = digits(el.value); el.value = won(p.amount); }
        else if (f === 'type') { p.type = el.value; var c = cats(p.type); p.category = (c.filter(function(x){ return /기타/.test(x.name); })[0] || c[0] || {}).name || ''; $('#pv').innerHTML = previewHTML(); bindPreview(); }
        else { p[f] = el.value; if (f === 'category') row.querySelector('.ico').textContent = icon(p.category); }
      };
    });
    var d = row.querySelector('[data-del]'); if (d) d.onclick = function(){ S.preview.splice(i, 1); $('#pv').innerHTML = previewHTML(); bindPreview(); $('#saveAll').disabled = !S.preview.length; };
  });
}

function saveItems(items){
  var now = new Date().toISOString();
  var clean = items.filter(function(p){ return p.amount; }).map(function(p){
    return { id: p.id || uid(), date: p.date, type: p.type, category: p.category, amount: Math.round(p.amount), desc: p.desc, method: p.method, who: p.who || S.me, memo: p.memo || '', created: now };
  });
  if (!clean.length) return false;
  clean.forEach(function(t){ S.data.tx.push(t); });
  var lm = clean[clean.length - 1].method; if (clean[clean.length - 1].type === '지출' && lm) LS.set('lastMethod', lm);
  queue({ op: 'add', items: clean });
  return clean;
}

function bindHome(){
  var say = $('#say');
  var tm;
  say.oninput = function(){ cancelAuto(); S.draft = say.value; clearTimeout(tm); tm = setTimeout(reparse, 250); };
  if (S.draft) reparse();
  $('#saveAll').onclick = function(){ doSave(); };
  function doSave(){
    cancelAuto();
    var saved = saveItems(S.preview);
    if (!saved) return;
    var total = saved.reduce(function(s, t){ return s + t.amount; }, 0);
    S.draft = ''; S.preview = [];
    toast(saved.length > 1 ? saved.length + '건, ' + won(total) + '원 저장했어요' : (saved[0].desc || saved[0].category) + ' ' + won(total) + '원 저장했어요');
    render();
  }
  S.doSave = doSave;
  $('#manual').onclick = function(){ openEdit(null); };
  $('#seeAll').onclick = function(){ S.view = 'list'; render(); window.scrollTo(0, 0); };
  bindItems();
  setupMic();
}

function bindItems(){ document.querySelectorAll('.item[data-id]').forEach(function(el){ el.onclick = function(){ var t = S.data.tx.filter(function(x){ return x.id === el.dataset.id; })[0]; if (t) openEdit(t); }; }); }

/* ---------- 원터치 음성 입력 ---------- */
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
var V = { rec: null };
function setMicUI(state, text, sub){
  var b = $('#micBig'), vt = $('#vt'); if (!b || !vt) return;
  b.classList.toggle('rec', state === 'rec'); b.classList.toggle('hint', state === 'hint');
  b.setAttribute('aria-label', state === 'rec' ? '녹음 멈추기' : '말로 입력');
  if (text != null) vt.innerHTML = '<b' + (state === 'live' ? ' class="live"' : '') + '>' + esc(text) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '');
}
function startListen(fromGesture){
  if (!SR || S.view !== 'home' || !$('#micBig')) return false;
  if (V.rec) { try{ V.rec.stop(); }catch(e){} return true; }
  cancelAuto();
  var rec; try { rec = new SR(); } catch (e) { return false; }
  rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  var base = S.draft ? S.draft.replace(/[\s,]*$/, '') + ', ' : '';
  V = { rec: rec, got: false, err: '', gesture: fromGesture };
  rec.onstart = function(){ setMicUI('rec', '듣고 있어요…', '말을 마치면 자동으로 멈춰요 · 다시 누르면 멈춤'); };
  rec.onresult = function(ev){
    var txt = ''; for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    txt = txt.trim(); if (!txt) return;
    V.got = true; S.draft = base + txt;
    var say = $('#say'); if (say) say.value = S.draft;
    setMicUI('rec', '“' + txt + '”', '듣고 있어요…');
  };
  rec.onerror = function(ev){ V.err = ev.error || 'error'; };
  rec.onend = function(){
    var st = V; V = { rec: null };
    if (st.got) {
      setMicUI('', '눌러서 말하기', '더 말하면 아래에 이어서 들어가요');
      reparse();
      if (S.preview.length && LS.get('autoSave', true)) startAuto();
      return;
    }
    if (st.err === 'not-allowed' || st.err === 'service-not-allowed') {
      if (st.gesture) { setMicUI('', '마이크를 쓸 수 없어요', isIOS() ? '설정 → Safari(또는 Chrome) → 마이크 허용, 그리고 설정 → Siri에서 받아쓰기를 켜 주세요' : '주소창의 자물쇠 → 권한 → 마이크 허용을 눌러 주세요'); }
      else setMicUI('hint', '눌러서 말하기', '버튼을 누르면 바로 들어요');
    } else if (st.err === 'no-speech' || !st.err) setMicUI('', '못 들었어요', '버튼을 누르고 다시 말해 주세요');
    else if (st.err === 'network') setMicUI('', '음성 인식이 인터넷에 연결되지 않았어요', '연결을 확인하거나 아래에 써 주세요');
    else if (st.err !== 'aborted') setMicUI('', '다시 눌러 말해 주세요', '음성 인식 오류: ' + st.err);
    else setMicUI('', '눌러서 말하기', '예) 점심 김밥천국 8천원, 커피 4500원');
  };
  try { rec.start(); } catch (e) { V = { rec: null }; if (!fromGesture) setMicUI('hint', '눌러서 말하기', '버튼을 누르면 바로 들어요'); return false; }
  return true;
}
function startAuto(){
  cancelAuto();
  var box = $('#autoBox'); if (!box) return;
  var sec = 3;
  box.innerHTML = '<div class="auto"><span><b id="autoSec">' + sec + '</b>초 뒤 자동 저장</span><i style="--d:' + sec + 's"></i><button class="btn ghost sm" id="autoCancel" style="padding:6px 10px">취소</button></div>';
  $('#autoCancel').onclick = function(){ cancelAuto(); toast('자동 저장을 멈췄어요. 고친 뒤 저장을 눌러 주세요.'); };
  S.autoTimer = setInterval(function(){
    sec--; var el = $('#autoSec'); if (el) el.textContent = sec;
    if (sec <= 0) { cancelAuto(); if (S.preview.length && S.doSave) S.doSave(); }
  }, 1000);
}
function cancelAuto(){ if (S.autoTimer) { clearInterval(S.autoTimer); S.autoTimer = null; } var box = $('#autoBox'); if (box) box.innerHTML = ''; }
function setupMic(){ var b = $('#micBig'); if (b) b.onclick = function(e){ e.preventDefault(); startListen(true); }; }

/* ---------- 내역 ---------- */
function monthNav(){ return '<div class="mnav"><button data-mk="-1">‹</button><b>' + mLabel(S.month) + '</b><button data-mk="1">›</button></div>'; }
function bindMonthNav(){ document.querySelectorAll('[data-mk]').forEach(function(b){ b.onclick = function(){ S.month = shiftMonth(S.month, +b.dataset.mk); render(); }; }); }

function listHTML(){
  var list = txOfMonth(S.month);
  var who = ['전체'].concat(members()); if (list.some(function(t){ return t.who === '자동'; })) who.push('자동');
  var f = list.filter(function(t){
    if (S.ftype !== '전체' && t.type !== S.ftype) return false;
    if (S.fwho !== '전체' && t.who !== S.fwho) return false;
    if (S.q) { var q = S.q.toLowerCase(); if ((t.desc + ' ' + t.category + ' ' + t.method + ' ' + t.memo).toLowerCase().indexOf(q) < 0) return false; }
    return true;
  }).sort(sortTx);
  var groups = {}; f.forEach(function(t){ (groups[t.date] = groups[t.date] || []).push(t); });
  var body = Object.keys(groups).sort().reverse().map(function(d){
    var exp = sumBy(groups[d], '지출');
    return '<div class="day"><span>' + dLabel(d) + '</span><span class="num">' + (exp ? '-' + won(exp) : '') + '</span></div>' + groups[d].map(itemHTML).join('');
  }).join('');
  var tot = { e: sumBy(f, '지출'), i: sumBy(f, '수입'), s: sumBy(f, '저축') };
  return monthNav() +
    '<div class="chips" style="margin-top:6px">' + ['전체'].concat(TYPES).map(function(t){ return '<button class="chip' + (S.ftype === t ? ' on' : '') + '" data-ft="' + t + '">' + t + '</button>'; }).join('') +
    '<span style="width:8px;flex:none"></span>' + who.map(function(w){ return '<button class="chip' + (S.fwho === w ? ' on' : '') + '" data-fw="' + esc(w) + '">' + (w === '전체' ? '모두' : esc(w)) + '</button>'; }).join('') + '</div>' +
    '<input class="inp" id="q" placeholder="검색 (내용·카테고리·메모)" value="' + esc(S.q) + '">' +
    '<div class="card"><div class="sumrow"><div><div class="k">지출</div><div class="v">' + won(tot.e) + '</div></div><div><div class="k">수입</div><div class="v amt-수입">' + won(tot.i) + '</div></div><div><div class="k">저축</div><div class="v amt-저축">' + won(tot.s) + '</div></div></div>' +
    '<div class="list">' + (body || '<div class="empty">내역이 없어요.</div>') + '</div></div>' +
    '<button class="btn pri block" id="addOne">+ 내역 추가</button>';
}

function bindList(){
  bindMonthNav(); bindItems();
  document.querySelectorAll('[data-ft]').forEach(function(b){ b.onclick = function(){ S.ftype = b.dataset.ft; render(); }; });
  document.querySelectorAll('[data-fw]').forEach(function(b){ b.onclick = function(){ S.fwho = b.dataset.fw; render(); }; });
  var q = $('#q'), tm; q.oninput = function(){ clearTimeout(tm); tm = setTimeout(function(){ S.q = q.value; var pos = q.selectionStart; render(); var nq = $('#q'); nq.focus(); try{ nq.setSelectionRange(pos, pos); }catch(e){} }, 300); };
  $('#addOne').onclick = function(){ openEdit(null); };
}

/* ---------- 입력·수정 시트 ---------- */
function openEdit(t){
  var isNew = !t;
  var e = t ? JSON.parse(JSON.stringify(t)) : { id: uid(), date: S.view === 'list' && S.month !== ym(new Date()) ? S.month + '-01' : ymd(new Date()), type: '지출', category: '', amount: 0, desc: '', method: LS.get('lastMethod', '') || methods()[0] || '', who: S.me, memo: '' };
  if (!e.category) e.category = (cats(e.type)[0] || {}).name || '';
  var sh = $('#sheet'), catTouched = false;
  function draw(){
    sh.innerHTML = '<div class="row between"><h3 style="margin:0">' + (isNew ? '내역 추가' : '내역 수정') + '</h3><button class="x" id="eClose" style="font-size:24px">×</button></div>' +
      '<div class="seg" style="margin-top:12px">' + TYPES.map(function(x){ return '<button data-ty="' + x + '" class="' + (x === e.type ? 'on' : '') + '">' + x + '</button>'; }).join('') + '</div>' +
      '<div class="fld"><label>금액 (원)</label><input class="inp amtbig num" id="eAmt" inputmode="numeric" value="' + (e.amount ? won(e.amount) : '') + '" placeholder="0"></div>' +
      '<div class="fld"><label>카테고리</label><div class="grid">' + cats(e.type).map(function(c){ return '<button class="chip' + (c.name === e.category ? ' on' : '') + '" data-ca="' + esc(c.name) + '">' + icon(c.name) + ' ' + esc(c.name) + '</button>'; }).join('') + '</div></div>' +
      '<div class="fld"><label>내용</label><input class="inp" id="eDesc" value="' + esc(e.desc) + '" placeholder="예) 김밥천국"></div>' +
      '<div class="row" style="gap:8px"><div class="fld grow"><label>날짜</label><input class="inp" type="date" id="eDate" value="' + e.date + '"></div>' +
      '<div class="fld grow"><label>결제수단</label><select class="inp" id="eMethod">' + methodOptions(e.method) + '</select></div></div>' +
      '<div class="row" style="gap:8px"><div class="fld grow"><label>입력자</label><select class="inp" id="eWho">' + members().concat(e.who && members().indexOf(e.who) < 0 ? [e.who] : []).map(function(m){ return '<option' + (m === e.who ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select></div>' +
      '<div class="fld grow"><label>메모</label><input class="inp" id="eMemo" value="' + esc(e.memo) + '"></div></div>' +
      '<div class="row" style="margin-top:8px">' + (isNew ? '' : '<button class="btn danger" id="eDel">삭제</button>') + '<button class="btn pri grow" id="eSave">저장</button></div>';
    sh.querySelectorAll('[data-ty]').forEach(function(b){ b.onclick = function(){ pull(); e.type = b.dataset.ty; var c = cats(e.type); e.category = (c[0] || {}).name || ''; catTouched = true; draw(); }; });
    sh.querySelectorAll('[data-ca]').forEach(function(b){ b.onclick = function(){ pull(); e.category = b.dataset.ca; catTouched = true; draw(); }; });
    $('#eDesc').onchange = function(){
      if (catTouched || !isNew) return;
      pull(); if (!e.desc) return;
      var g = Parser.guessCategory(e.desc, e.desc, cats(), history());
      if (g.category && (g.category !== e.category || g.type !== e.type)) { e.type = g.type; e.category = g.category; draw(); }
    };
    $('#eClose').onclick = closeSheet;
    $('#eAmt').onblur = function(){ var v = digits(this.value); this.value = v ? won(v) : ''; };
    $('#eSave').onclick = function(){
      pull();
      if (!e.amount) return toast('금액을 입력해 주세요.');
      if (isNew) { saveItems([e]); toast('저장했어요'); }
      else {
        S.data.tx = S.data.tx.map(function(x){ return x.id === e.id ? e : x; });
        queue({ op: 'update', tx: e }); toast('수정했어요');
      }
      closeSheet(); render();
    };
    var del = $('#eDel'); if (del) del.onclick = function(){
      if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = '정말 삭제'; return; }
      S.data.tx = S.data.tx.filter(function(x){ return x.id !== e.id; });
      queue({ op: 'delete', id: e.id }); toast('삭제했어요'); closeSheet(); render();
    };
  }
  function pull(){
    var a = $('#eAmt'); if (!a) return;
    e.amount = digits(a.value); e.desc = $('#eDesc').value.trim(); e.date = $('#eDate').value || ymd(new Date());
    e.method = $('#eMethod').value; e.who = $('#eWho').value; e.memo = $('#eMemo').value.trim();
  }
  draw();
  $('#sheetBg').classList.add('on');
  if (isNew) setTimeout(function(){ $('#eAmt').focus(); }, 80);
}
function closeSheet(){ $('#sheetBg').classList.remove('on'); }
$('#sheetBg').onclick = function(ev){ if (ev.target.id === 'sheetBg') closeSheet(); };

/* ---------- 통계 ---------- */
function statsHTML(){
  var list = txOfMonth(S.month);
  var exp = list.filter(function(t){ return t.type === '지출'; });
  var byCat = {}; exp.forEach(function(t){ byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
  var rows = cats('지출').map(function(c){ return { name: c.name, budget: c.budget, spent: byCat[c.name] || 0 }; });
  Object.keys(byCat).forEach(function(k){ if (!rows.some(function(r){ return r.name === k; })) rows.push({ name: k, budget: 0, spent: byCat[k] }); });
  rows = rows.filter(function(r){ return r.spent || r.budget; }).sort(function(a, b){ return b.spent - a.spent; });
  var total = sumBy(list, '지출');
  var catHTML = rows.map(function(r){
    var pct = r.budget ? r.spent / r.budget : 0, cls = pct >= 1 ? 'bad' : pct >= 0.85 ? 'warn' : '';
    var share = total ? Math.round(r.spent / total * 100) : 0;
    return '<div class="cat"><div class="row between"><span>' + icon(r.name) + ' ' + esc(r.name) + (pct >= 1 ? '<span class="badge">초과</span>' : '') + '</span><span class="num"><b>' + won(r.spent) + '</b>' + (r.budget ? '<span class="faint xs"> / ' + won(r.budget) + '</span>' : '') + '</span></div>' +
      (r.budget ? '<div class="bar"><i class="' + cls + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i></div>' : '<div class="faint xs">예산 없음 · 지출의 ' + share + '%</div>') + '</div>';
  }).join('');
  // 6개월 추이
  var ms = []; for (var k = 5; k >= 0; k--) ms.push(shiftMonth(S.month, -k));
  var vals = ms.map(function(m){ return sumBy(txOfMonth(m), '지출'); });
  var max = Math.max.apply(null, vals.concat([1]));
  var trend = '<div class="trend">' + ms.map(function(m, i){ return '<div class="col"><div class="v">' + (vals[i] ? Math.round(vals[i] / 10000) + '만' : '') + '</div><div class="b' + (m === S.month ? ' cur' : '') + '" style="height:' + (vals[i] / max * 110).toFixed(0) + 'px"></div><div class="l">' + (+m.slice(5)) + '월</div></div>'; }).join('') + '</div>';
  var data = S.data.tx.filter(function(t){ return t.date >= ms[0] + '-01'; });
  var avg = vals.slice(0, 5).filter(Boolean);
  avg = avg.length ? avg.reduce(function(a, b){ return a + b; }, 0) / avg.length : 0;
  function split(key){ var o = {}; exp.forEach(function(t){ var kk = t[key] || '미지정'; o[kk] = (o[kk] || 0) + t.amount; }); return Object.keys(o).sort(function(a, b){ return o[b] - o[a]; }).map(function(kk){ return '<div class="row between" style="padding:6px 0"><span>' + esc(kk) + '</span><span class="num"><b>' + won(o[kk]) + '</b><span class="faint xs"> ' + (total ? Math.round(o[kk] / total * 100) : 0) + '%</span></span></div>'; }).join('') || '<div class="faint sm">내역 없음</div>'; }
  return monthNav() + summaryCard(S.month) +
    '<div class="card"><h3>카테고리별 지출</h3>' + (catHTML || '<div class="empty">지출 내역이 없어요.</div>') + '</div>' +
    '<div class="card"><h3>최근 6개월 지출</h3>' + trend + (avg ? '<div class="faint sm" style="margin-top:8px">앞선 5개월 평균 ' + won(avg) + '원 · 이번 달은 평균보다 ' + (vals[5] >= avg ? '<b>' + won(vals[5] - avg) + '원 많아요</b>' : '<b>' + won(avg - vals[5]) + '원 적어요</b>') + '</div>' : '') + '</div>' +
    '<div class="card"><h3>누가 썼나</h3>' + split('who') + '</div>' +
    '<div class="card"><h3>결제수단별</h3>' + split('method') + '</div>';
}

/* ---------- 설정 ---------- */
function settingsHTML(){
  var c = S.data.cats, rec = S.data.rec || [];
  return '<div class="card"><h3>이 폰의 사용자</h3><div class="chips">' + members().map(function(m){ return '<button class="chip' + (m === S.me ? ' on' : '') + '" data-me="' + esc(m) + '">' + esc(m) + '</button>'; }).join('') + '</div></div>' +
    '<div class="card"><h3>가족 구성원 · 결제수단</h3>' +
      '<div class="fld"><label>구성원 (쉼표로 구분)</label><input class="inp" id="sMembers" value="' + esc(members().join(', ')) + '"></div>' +
      '<div class="fld"><label>결제수단 (쉼표로 구분)</label><input class="inp" id="sMethods" value="' + esc(methods().join(', ')) + '"></div>' +
      '<button class="btn pri block" id="sCfgSave">저장</button></div>' +
    '<div class="card"><h3>카테고리 · 월 예산</h3><div class="faint xs" style="margin-bottom:6px">키워드가 문장에 들어 있으면 그 카테고리로 자동 분류돼요. 한 번 고친 분류는 다음부터 기억해요.</div><div id="catRows">' +
      c.map(function(x, i){ return catRowHTML(x, i); }).join('') + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="btn ghost" id="catAdd">+ 추가</button><button class="btn pri grow" id="catSave">카테고리 저장</button></div>' +
      '<div class="faint xs" style="margin-top:8px">지출 예산 합계 <b class="num">' + won(budgetTotal()) + '원</b></div></div>' +
    '<div class="card"><h3>고정지출 자동 입력</h3><div class="faint xs" style="margin-bottom:6px">월세·통신비·보험·적금처럼 매달 같은 날 나가는 돈은 그날이 지나면 자동으로 기록돼요.</div><div id="recRows">' +
      rec.map(function(r, i){ return recRowHTML(r, i); }).join('') + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="btn ghost" id="recAdd">+ 추가</button><button class="btn pri grow" id="recSave">고정지출 저장</button></div></div>' +
    '<div class="card"><h3>말로 입력</h3>' +
      (SR ? '<label class="toggle"><span>앱을 열면 바로 듣기<br><span class="faint xs">아이콘을 누르자마자 녹음이 시작돼요</span></span><input type="checkbox" id="tAutoListen"' + (LS.get('autoListen', true) ? ' checked' : '') + '></label>' : '<div class="faint sm">이 브라우저는 앱 안 녹음을 지원하지 않아요.</div>') +
      '<label class="toggle"><span>말하고 나면 3초 뒤 자동 저장<br><span class="faint xs">그 사이에 내용을 누르면 멈춰요</span></span><input type="checkbox" id="tAutoSave"' + (LS.get('autoSave', true) ? ' checked' : '') + '></label>' +
      (isIOS() ? '<div class="tip">아이폰에서는 <b>단축어</b> 아이콘을 홈 화면에 두면, 누르자마자 듣고 저장까지 해요. 만드는 방법은 설치 안내 페이지에 있어요.</div>' : '') +
    '</div>' +
    '<div class="card"><h3>보안 · 기타</h3>' +
      '<div class="fld"><label>가족 비밀번호 바꾸기</label><div class="row"><input class="inp grow" id="sPin" type="password" inputmode="numeric" maxlength="8" placeholder="새 비밀번호"><button class="btn" id="sPinSave">변경</button></div></div>' +
      '<div class="row" style="gap:8px"><button class="btn ghost grow" id="sReload">새로고침</button><button class="btn ghost grow" id="sLogout">로그아웃</button></div>' +
      '<div class="tip">모든 내역은 구글 시트 <b>“거래내역”</b> 탭에 쌓여요. 컴퓨터에서 시트를 열면 엑셀처럼 정리하거나 내려받을 수 있어요.</div></div>';
}
function catRowHTML(x, i){
  return '<div class="set-row" data-ci="' + i + '"><select data-k="type">' + TYPES.map(function(t){ return '<option' + (t === x.type ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
    '<input data-k="name" value="' + esc(x.name) + '" placeholder="이름"><input data-k="budget" inputmode="numeric" class="num" style="text-align:right" value="' + (x.budget ? won(x.budget) : '') + '" placeholder="예산">' +
    '<button class="x" data-cdel="' + i + '">×</button><input class="kw" data-k="keywords" value="' + esc(x.keywords) + '" placeholder="키워드 (쉼표로)"></div>';
}
function recRowHTML(r, i){
  return '<div class="rec-row" data-ri="' + i + '"><input data-k="desc" value="' + esc(r.desc) + '" placeholder="내용 (예: 월세)"><input data-k="amount" inputmode="numeric" class="num" value="' + (r.amount ? won(r.amount) : '') + '" placeholder="금액">' +
    '<select data-k="type">' + TYPES.map(function(t){ return '<option' + (t === r.type ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
    '<select data-k="category">' + catOptions(r.type, r.category) + '</select>' +
    '<select data-k="day">' + Array.apply(null, Array(31)).map(function(_, d){ return '<option value="' + (d + 1) + '"' + (d + 1 === r.day ? ' selected' : '') + '>매월 ' + (d + 1) + '일</option>'; }).join('') + '</select>' +
    '<select data-k="method">' + methodOptions(r.method) + '</select>' +
    '<label class="sm row" style="gap:6px"><input type="checkbox" data-k="active" style="width:auto"' + (r.active !== false ? ' checked' : '') + '> 사용</label>' +
    '<button class="btn ghost sm" data-rdel="' + i + '" style="padding:6px">삭제</button></div>';
}
function readCatRows(){
  return Array.prototype.map.call(document.querySelectorAll('[data-ci]'), function(row){
    var g = function(k){ return row.querySelector('[data-k="' + k + '"]').value; };
    return { type: g('type'), name: g('name').trim(), budget: digits(g('budget')), keywords: g('keywords') };
  });
}
function readRecRows(){
  return Array.prototype.map.call(document.querySelectorAll('[data-ri]'), function(row, i){
    var g = function(k){ return row.querySelector('[data-k="' + k + '"]'); };
    var old = (S.data.rec || [])[+row.dataset.ri] || {};
    return { id: old.id || uid(), desc: g('desc').value.trim(), amount: digits(g('amount').value), type: g('type').value, category: g('category').value, day: +g('day').value, method: g('method').value, active: g('active').checked };
  });
}
function bindSettings(){
  document.querySelectorAll('[data-me]').forEach(function(b){ b.onclick = function(){ S.me = b.dataset.me; LS.set('me', S.me); render(); toast(S.me + '(으)로 입력해요'); }; });
  function busy(btn, p, ok){ btn.disabled = true; p.then(function(){ toast(ok); return load(true); }).catch(function(e){ toast('실패: ' + e.message); }).then(function(){ btn.disabled = false; }); }
  $('#sCfgSave').onclick = function(){
    var mem = $('#sMembers').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var met = $('#sMethods').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    if (!mem.length) return toast('구성원을 한 명 이상 적어 주세요.');
    if (mem.indexOf(S.me) < 0) { S.me = mem[0]; LS.set('me', S.me); }
    busy(this, call('saveCfg', { members: mem, methods: met }), '저장했어요');
  };
  $('#catAdd').onclick = function(){ var cur = readCatRows(); cur.push({ type: '지출', name: '', budget: 0, keywords: '' }); S.data.cats = cur; render(); var rows = document.querySelectorAll('[data-ci]'); rows[rows.length - 1].querySelector('[data-k="name"]').focus(); };
  document.querySelectorAll('[data-cdel]').forEach(function(b){ b.onclick = function(){ var cur = readCatRows(); cur.splice(+b.dataset.cdel, 1); S.data.cats = cur; render(); }; });
  $('#catSave').onclick = function(){ var cur = readCatRows().filter(function(x){ return x.name; }); if (!cur.length) return toast('카테고리가 하나는 있어야 해요.'); S.data.cats = cur; busy(this, call('saveCats', { cats: cur }), '카테고리를 저장했어요'); };
  document.querySelectorAll('[data-ri] [data-k="desc"]').forEach(function(inp){ inp.onchange = function(){
    var row = inp.closest('[data-ri]'); if (!inp.value.trim()) return;
    var g = Parser.guessCategory(inp.value.trim(), inp.value.trim(), cats(), history());
    if (!g.category) return;
    row.querySelector('[data-k="type"]').value = g.type;
    row.querySelector('[data-k="category"]').innerHTML = catOptions(g.type, g.category);
    if (g.type !== '지출') { var ms = methods().filter(function(x){ return /이체|계좌/.test(x); }); if (ms[0]) row.querySelector('[data-k="method"]').value = ms[0]; }
  }; });
  document.querySelectorAll('[data-ri] [data-k="type"]').forEach(function(sel){ sel.onchange = function(){ var row = sel.closest('[data-ri]'); row.querySelector('[data-k="category"]').innerHTML = catOptions(sel.value, ''); }; });
  $('#recAdd').onclick = function(){ var cur = readRecRows(); cur.push({ id: uid(), desc: '', amount: 0, type: '지출', category: (cats('지출')[0] || {}).name, day: 1, method: methods()[0] || '', active: true }); S.data.rec = cur; render(); };
  document.querySelectorAll('[data-rdel]').forEach(function(b){ b.onclick = function(){ var cur = readRecRows(); cur.splice(+b.dataset.rdel, 1); S.data.rec = cur; render(); }; });
  $('#recSave').onclick = function(){ var cur = readRecRows().filter(function(r){ return r.amount && r.desc; }); S.data.rec = cur; busy(this, call('saveRec', { list: cur }), '고정지출을 저장했어요'); };
  $('#sPinSave').onclick = function(){ var p = $('#sPin').value.trim(); if (!/^\d{4,8}$/.test(p)) return toast('숫자 4~8자리로 입력해 주세요.'); var btn = this; btn.disabled = true; call('saveCfg', { newPin: p }).then(function(){ S.pin = p; LS.set('pin', p); toast('비밀번호를 바꿨어요. 배우자에게도 알려 주세요.'); }).catch(function(e){ toast(e.message); }).then(function(){ btn.disabled = false; }); };
  var tal = $('#tAutoListen'); if (tal) tal.onchange = function(){ LS.set('autoListen', tal.checked); toast(tal.checked ? '앱을 열면 바로 들어요' : '마이크를 눌러야 들어요'); };
  $('#tAutoSave').onchange = function(){ LS.set('autoSave', this.checked); };
  $('#sReload').onclick = function(){ load().then(flush); };
  $('#sLogout').onclick = function(){ LS.del('pin'); LS.del('cache'); LS.del('me'); S.pin = ''; S.data = null; S.me = ''; showGate(); };
}

/* ---------- 시작 ---------- */
document.querySelectorAll('.nav button').forEach(function(b){ b.onclick = function(){ S.view = b.dataset.v; if (S.view !== 'list') S.month = S.view === 'stats' ? S.month : ym(new Date()); render(); window.scrollTo(0, 0); }; });
var hiddenAt = 0;
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); if (V.rec) { try{ V.rec.abort(); }catch(e){} } return; }
  if (!S.pin) return;
  var away = hiddenAt && Date.now() - hiddenAt > 20000;
  if (away && S.data && !S.draft && !$('#sheetBg').classList.contains('on')) { S.view = 'home'; render(); maybeAutoListen(false); }
  flush().then(function(){ return load(true); });
});
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
setInterval(function(){ if (document.visibilityState === 'visible' && S.pin && !$('#sheetBg').classList.contains('on') && !(S.view === 'home' && (S.draft || V.rec || S.autoTimer)) && S.view !== 'settings') { flush().then(function(){ return load(true); }); } }, 60000);

if (S.pin) start(); else showGate();
})();
</script>
</body>
</html>
