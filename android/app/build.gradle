plugins { id 'com.android.application' }

android {
    namespace 'kr.gagyebu.app'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.gagyebu.app'
        minSdk 26
        targetSdk 35
        def runNo = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode Integer.parseInt(runNo)
        versionName "1.0.${runNo}"
    }
    signingConfigs {
        release {
            storeFile file('gagyebu.jks')
            storePassword 'gagyebu-app'
            keyAlias 'gagyebu'
            keyPassword 'gagyebu-app'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
