plugins { id 'com.android.application' }

android {
    namespace 'kr.gagyebu.app'
    compileSdk 34
    defaultConfig {
        applicationId 'kr.gagyebu.app'
        minSdk 26
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('gagyebu.jks')
            storePassword 'gagyebu-app'
            keyAlias 'gagyebu'
            keyPassword 'gagyebu-app'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
