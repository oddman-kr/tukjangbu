name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 빌드
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk gagyebu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gagyebu-apk
          path: gagyebu.apk

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 우리집 가계부 앱 ${{ github.run_number }}
          body: 갤럭시(안드로이드)용 설치 파일입니다. gagyebu.apk를 눌러 내려받아 설치하세요.
          files: gagyebu.apk
          make_latest: true
