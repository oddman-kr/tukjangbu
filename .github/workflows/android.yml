name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        shell: bash
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log

      - name: 실패 원인 남기기
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E -A12 "What went wrong|error:|FAILURE|e: " build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build-log::${msg}"
          tail -40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=build-tail::{}"

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk gagyebu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gagyebu-apk
          path: gagyebu.apk

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 우리집 가계부 앱 ${{ github.run_number }}
          body: 갤럭시(안드로이드)용 설치 파일입니다. gagyebu.apk를 눌러 내려받아 설치하세요.
          files: gagyebu.apk
          make_latest: true
