name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK 빌드
        shell: bash
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log

      - name: 실패 원인 남기기
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E -A12 "What went wrong|error:|FAILURE|e: " build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build-log::${msg}"
          tail -40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=build-tail::{}"

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk tukjangbu-v1.0.${{ github.run_number }}.apk

      # 플레이스토어용 AAB: 업로드 키가 Secrets에 있을 때만 만들어요
      - name: 플레이스토어용 AAB 빌드
        id: aab
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "업로드 키가 아직 없어서 AAB는 건너뛰어요"; echo "made=false" >> $GITHUB_OUTPUT; exit 0; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle -p android bundleRelease -Pupload --no-daemon 2>&1 | tee build.log
          cp android/app/build/outputs/bundle/release/app-release.aab tukjangbu-v1.0.${{ github.run_number }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "made=true" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: tukjangbu-v1.0.${{ github.run_number }}-apk
          path: tukjangbu-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.made == 'true'
        with:
          name: tukjangbu-v1.0.${{ github.run_number }}-aab-for-play-store
          path: tukjangbu-v1.0.${{ github.run_number }}.aab

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 툭장부 앱 1.0.${{ github.run_number }}
          body: |
            갤럭시(안드로이드)용 설치 파일입니다. tukjangbu-v1.0.${{ github.run_number }}.apk를 눌러 내려받아 설치하세요.
            tukjangbu-v1.0.${{ github.run_number }}.aab는 플레이 콘솔에 올리는 파일이에요 (폰에 직접 설치하는 파일이 아니에요).
          files: |
            tukjangbu-v1.0.${{ github.run_number }}.apk
            tukjangbu-v1.0.${{ github.run_number }}.aab
          fail_on_unmatched_files: false
          make_latest: true
