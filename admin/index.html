<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>툭장부 관리자</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#22375C"><link rel="icon" href="../icon-192.png">
<style>
:root{--bg:#F2F3F6;--card:#fff;--ink:#1B1E26;--ink2:#555B68;--ink3:#8A90A0;--line:#E2E5EC;--pri:#2F4B7C;--nav:#1B2A47;--soft:#E7EDF6;--ok:#167A46;--okbg:#E3F3EA;--warn:#9A5B00;--warnbg:#FBEFD9;--bad:#B3261E;--badbg:#FBE4E2}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14.5px;line-height:1.5}
.topbar{background:var(--nav);color:#fff;padding:0 max(16px,env(safe-area-inset-left))}
.topbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;height:56px}
.topbar img{width:30px;height:30px;border-radius:8px}.topbar b{font-size:16px}.topbar .sp{flex:1}.topbar .who{font-size:12.5px;opacity:.8}
.tabs{display:flex;gap:2px;max-width:1180px;margin:0 auto;padding:0 0 0 0;overflow-x:auto}
.tabs button{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:#9DB8EA}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 60px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;color:inherit;font:inherit;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.ghostw{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}

.cohort td.c{text-align:center;font-variant-numeric:tabular-nums}.heat{display:inline-block;min-width:46px;border-radius:6px;padding:2px 6px}
.form{display:grid;gap:8px}.form label{font-size:12.5px;color:var(--ink3);display:grid;gap:4px}.form .row{display:flex;gap:8px;flex-wrap:wrap}.form .row>*{flex:1;min-width:140px}

.reply{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13.5px;white-space:pre-wrap}
.lvl-info{background:var(--soft);color:var(--pri)}.lvl-warn{background:var(--warnbg);color:var(--warn)}.lvl-event{background:var(--okbg);color:var(--ok)}
.form label.sw,.sw{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-size:14px}.form label .inp,.form label select{color:var(--ink)}.form h2{margin-bottom:0}.sw input{width:18px;height:18px}
.mini{font-size:12px;padding:4px 8px}

// ---------- 로그인 ----------

  }).catch(fail);
}
function boot(){
  if (!getS()) return loginView();
  rpc('am_i_admin').then(function(ok){ if (ok === true) return api('me').then(function(m){ ROLE = m.role || 'owner'; shell(); }); else { setS(null); loginView('이 이메일은 관리자로 등록되어 있지 않아요.'); } }).catch(function(e){ loginView(e.login ? '' : e.message); });
}
boot();
</script></body></html>
