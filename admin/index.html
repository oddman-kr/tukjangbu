// ---------- 로그인 ----------
function loginView(msg){

        '<div class="note" style="margin-top:8px">환불·해지·결제 내역 원본은 구글 플레이 콘솔 → 주문 관리에서 봐요. 정산금은 플레이 콘솔 → 수익 보고서에 매달 나와요.</div></div>';
    document.querySelectorAll('tr[data-u]').forEach(function(tr){ if (tr.dataset.u) tr.onclick = function(){ openUser(tr.dataset.u); }; });

var LVL = { info: '안내', warn: '중요', event: '이벤트' }, AUD = { all: '모두', free: '무료 이용자', paid: '유료 이용자' };

function noticeView(){
  api('notices').then(function(r){

      '<div class="card">' + (r.notices.length ? r.notices.map(function(n){ return '<div class="fb"><div class="m"><span class="pill lvl-' + n.level + '">' + LVL[n.level] + '</span><span>' + AUD[n.audience] + '</span><span>' + dt(n.starts_at) + ' ~ ' + (n.ends_at ? dt(n.ends_at) : '계속') + '</span>' + (on(n) ? '<span class="pill p-paid">게시 중</span>' : '<span class="pill p-free">' + (n.active ? (Date.parse(n.starts_at) > now ? '예약' : '끝남') : '꺼짐') + '</span>') + '<button class="btn mini" data-ned="' + n.id + '">고치기</button></div><div class="b"><b>' + esc(n.title) + '</b>' + (n.body ? '<br>' + esc(n.body) : '') + (n.link ? '<br><span class="note">' + esc(n.link) + '</span>' : '') + '</div></div>'; }).join('') : '<div class="note">아직 공지가 없어요. 업데이트 소식, 점검 안내, 이벤트를 알릴 때 써요.</div>') + '</div>';

    '<div class="row"><label>게시 시작<input class="inp" id="ns" type="datetime-local" value="' + toLocal(n.starts_at || new Date().toISOString()) + '"></label><label>게시 끝 (비우면 계속)<input class="inp" id="ne" type="datetime-local" value="' + toLocal(n.ends_at) + '"></label></div>' +
    '<label class="sw"><input type="checkbox" id="non"' + (n.active === false ? '' : ' checked') + '> 게시하기 (끄면 앱에서 바로 사라져요)</label>' +
