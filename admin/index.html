<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>툭장부 관리자</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#22375C"><link rel="icon" href="../icon-192.png">
<style>
:root{--bg:#F2F3F6;--card:#fff;--ink:#1B1E26;--ink2:#555B68;--ink3:#8A90A0;--line:#E2E5EC;--pri:#2F4B7C;--nav:#1B2A47;--soft:#E7EDF6;--ok:#167A46;--okbg:#E3F3EA;--warn:#9A5B00;--warnbg:#FBEFD9;--bad:#B3261E;--badbg:#FBE4E2}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1B1E26;--ink:#ECEEF3;--ink2:#B3B8C4;--ink3:#7E8494;--line:#2B303B;--pri:#9DB8EA;--nav:#0C1424;--soft:#1E2A42;--ok:#5BD08A;--okbg:#16301F;--warn:#F2B860;--warnbg:#3A2D16;--bad:#FF8A80;--badbg:#3D1E1B;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14.5px;line-height:1.5}
.topbar{background:var(--nav);color:#fff;padding:0 max(16px,env(safe-area-inset-left))}

.topbar img{width:30px;height:30px;border-radius:8px}.topbar b{font-size:16px}.topbar .sp{flex:1}.topbar .who{font-size:12.5px;opacity:.8}

.tabs button.on{color:#fff;border-bottom-color:#9DB8EA}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 60px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;color:inherit;font:inherit;font-weight:600}

table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--ink3);font-weight:600;background:var(--bg)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}tr:last-child td{border-bottom:0}

.p-paid{background:var(--okbg);color:var(--ok)}.p-trial{background:var(--soft);color:var(--pri)}.p-free{background:var(--bg);color:var(--ink2)}.p-ban{background:var(--badbg);color:var(--bad)}.p-adm{background:var(--warnbg);color:var(--warn)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;cursor:pointer;color:inherit;font:inherit;font-size:13px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:18px max(16px,env(safe-area-inset-right)) 40px 18px}

select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--card);color:inherit}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.login h1{font-size:20px;margin:6px 0 4px}.login .inp{width:100%;margin-top:10px}.login .btn{width:100%;margin-top:10px;padding:10px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.confirm{background:var(--badbg);border-radius:12px;padding:12px;margin-top:8px}

<script>
var URL_ = 'https://tognnsgghtmnwfwksegp.supabase.co', KEY = 'sb_publishable_VaTsnqKViXWOaoh3SmTd3g_VceRqIa9', SKEY = 'tuk_admin_session';

(function(){ var h = location.hash; if (h.indexOf('access_token=') >= 0) { var q = {}; h.slice(1).split('&').forEach(function(kv){ var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); setS(fromTok(q)); history.replaceState(null, '', location.pathname); } })();
function token(){
  var s = getS(); if (!s) return Promise.resolve(null);
  if (s.expires_at - 60 > Date.now() / 1000) return Promise.resolve(s.access_token);
  return fetch(URL_ + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) })
    .then(function(r){ return r.json(); }).then(function(o){ var n = fromTok(o); setS(n); return n && n.access_token; }).catch(function(){ return null; });
}
function req(path, body){ return token().then(function(t){ if (!t) throw Object.assign(new Error('로그인이 필요해요'), { login: true });
  return fetch(URL_ + path, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); })
  .then(function(r){ return r.text().then(function(x){ var o = null; try { o = x ? JSON.parse(x) : null; } catch (e) {} if (r.status === 401) throw Object.assign(new Error('로그인이 필요해요'), { login: true }); if (!r.ok || (o && o.ok === false)) throw new Error((o && o.message) || ('오류 ' + r.status)); return o; }); }); }

// ---------- 로그인 ----------
function loginView(msg){
  $('#app').innerHTML = '<div class="login"><img src="../icon-192.png" alt="" style="width:44px;height:44px;border-radius:12px"><h1>툭장부 관리자</h1><div class="note">운영자 전용이에요. 등록된 관리자 이메일로만 들어올 수 있어요.</div>' +
    '<form id="pwf"><input class="inp" id="em" type="email" placeholder="관리자 이메일" autocomplete="username"><input class="inp" id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="btn pri" id="pwgo" type="submit">로그인</button></form>' +
    '<div class="note" style="margin-top:14px">처음이거나 비밀번호를 잊었다면 <button class="btn" id="send" style="width:auto;padding:4px 10px;margin:0">로그인 메일 받기</button></div>' +
    '<div id="step2" hidden><div class="note" style="margin-top:10px">메일의 <b>로그인 링크</b>를 이 브라우저에서 누르면 들어와요. 들어온 뒤 오른쪽 위 <b>비밀번호 설정</b>에서 비밀번호를 정하면 다음부터는 이메일과 비밀번호로 로그인해요.</div><input class="inp" id="code" inputmode="numeric" maxlength="6" placeholder="메일에 6자리 코드가 있으면 입력"><button class="btn" id="verify">코드로 들어가기</button></div>' +

    ev.preventDefault();

    $('#pwgo').disabled = true;

      .catch(function(x){ $('#err').textContent = x.message; }).then(function(){ var b = $('#pwgo'); if (b) b.disabled = false; });
  };

    var e = $('#em').value.trim(); if (!/.+@.+\..+/.test(e)) { $('#err').textContent = '이메일을 먼저 넣어 주세요.'; return; }
    this.disabled = true;
    fetch(URL_ + '/auth/v1/otp?redirect_to=' + encodeURIComponent(location.origin + location.pathname), { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: e, create_user: true }) })
      .then(function(r){ return r.json().then(function(o){ if (!r.ok) throw new Error(o.msg || o.message || '메일을 보내지 못했어요'); }); })
      .then(function(){ $('#step2').hidden = false; $('#err').textContent = ''; toast('로그인 메일을 보냈어요'); })
      .catch(function(x){ $('#err').textContent = x.message; }).then(function(){ $('#send').disabled = false; });
  };
  $('#verify').onclick = function(){
    var e = $('#em').value.trim(), c = $('#code').value.trim(); if (c.length !== 6) return;
    fetch(URL_ + '/auth/v1/verify', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'email', email: e, token: c }) })
      .then(function(r){ return r.json(); }).then(function(o){ var s = fromTok(o); if (!s) throw new Error('코드가 맞지 않아요'); setS(s); boot(); }).catch(function(x){ $('#err').textContent = x.message; });
  };
}

// ---------- 화면 ----------
var tab = 'dash', users = [], uq = '', uf = 'all', fbF = '새 의견';
try { tab = localStorage.getItem('adm_tab') || 'dash'; } catch (e) {}

  $('#app').innerHTML = '<div class="topbar"><div class="in"><img src="../icon-192.png" alt=""><b>툭장부 관리자</b><span class="sp"></span><span class="who">' + esc(s.email) + '</span><button class="btn ghostw" id="setpw">비밀번호 설정</button><button class="btn ghostw" id="out">로그아웃</button></div>' +

      token().then(function(t){ return fetch(URL_ + '/auth/v1/user', { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: a }) }); })
        .then(function(r){ return r.json().then(function(o){ if (!r.ok) throw new Error(/weak|short|characters/i.test(o.msg || '') ? '비밀번호가 너무 쉬워요. 더 길게 정해 주세요.' : (o.msg || '저장하지 못했어요')); }); })
        .then(function(){ bg.remove(); toast('비밀번호를 정했어요. 다음부터 이메일과 비밀번호로 로그인하세요'); })
        .catch(function(x){ er.textContent = x.message; });
    };
  };
  document.querySelectorAll('[data-t]').forEach(function(b){ b.onclick = function(){ tab = b.dataset.t; try { localStorage.setItem('adm_tab', tab); } catch (e) {} shell(); }; });
  ({ dash: dash, users: usersView, fb: fbView, log: logView })[tab]();
}
function fail(e){ if (e.login) return loginView('다시 로그인해 주세요.'); $('#view').innerHTML = '<div class="card">불러오지 못했어요: ' + esc(e.message) + '</div>'; }
function k(l, v, s){ return '<div class="k"><div class="l">' + l + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
var PROV = { kakao: '카카오', google: '구글', naver: '네이버', email: '이메일', anonymous: '자녀(초대 코드)' };

  rpc('admin_stats').then(function(s){
    var paid = s.paid_month + s.paid_year, mrr = s.paid_month * 2900 + s.paid_year * 29000 / 12;
    var sig = s.signups_by_day || [], mx = Math.max.apply(null, sig.map(function(x){ return x.n; }).concat([1])), src = s.tx_by_source || {}, prov = s.providers || {};
    var SRC = { manual: '직접·말', voice: '말로', receipt: '영수증', recurring: '정기 지출', import: '옮겨 오기', wish: '위시', allowance: '용돈' };
    $('#view').innerHTML = '<div class="grid">' +
      k('전체 계정', won(s.users), '오늘 +' + s.users_today + ' · 7일 +' + s.users_7d) + k('가계부(가족)', won(s.households), '참여 ' + s.members_joined + ' · 초대 대기 ' + s.members_pending + ' · 자녀 ' + s.kids) +
      k('활동 가족 (7일)', s.active_7d, '오늘 ' + s.active_1d + ' · 30일 ' + s.active_30d) + k('유료 구독', paid, '월간 ' + s.paid_month + ' · 연간 ' + s.paid_year) +
      k('무료 체험 중', s.trial, '7일 안에 끝남 ' + s.trial_ending_7d) + k('예상 월 매출', won(mrr) + '원', '수수료·부가세 뺀 순매출 약 ' + won(mrr / 1.1 * 0.85) + '원') +
      k('기록 수', won(s.tx_total), '최근 7일 ' + won(s.tx_7d)) + k('영수증 인식 (이번 달)', won(s.ocr_month), '') + k('알림 켠 기기', s.devices, '오늘 확인 ' + s.devices_seen_1d) + k('새 의견', s.feedback_new, '탈퇴(30일) ' + s.deleted_30d) + '</div>' +
      '<div class="two"><div class="card"><h2>최근 30일 가입</h2><div class="bars">' + sig.map(function(x){ return '<div title="' + x.d + ' · ' + x.n + '명" style="height:' + (x.n / mx * 100).toFixed(1) + '%"></div>'; }).join('') + '</div><div class="axis"><span>' + ((sig[0] || {}).d || '') + '</span><span>' + ((sig[sig.length - 1] || {}).d || '') + '</span></div></div>' +
      '<div class="card"><h2>가입 방법</h2>' + Object.keys(prov).map(function(p){ return '<div class="kv"><span>' + (PROV[p] || p) + '</span><b>' + prov[p] + '</b></div>'; }).join('') + '<h2 style="margin-top:14px">최근 30일 기록 방법</h2>' + (Object.keys(src).length ? Object.keys(src).map(function(p){ return '<div class="kv"><span>' + (SRC[p] || p) + '</span><b>' + won(src[p]) + '</b></div>'; }).join('') : '<div class="note">아직 없어요</div>') + '</div></div>' +

function planPill(u){

function usersView(){
  $('#view').innerHTML = '<div class="toolbar"><input class="inp" id="q" placeholder="이메일, 이름, 가계부 이름으로 찾기" style="flex:1;min-width:200px" value="' + esc(uq) + '"><button class="btn pri" id="go">찾기</button></div>' +
    '<div class="toolbar">' + [['all', '전체'], ['paid', '유료'], ['trial', '체험 중'], ['free', '무료'], ['banned', '정지']].map(function(f){ return '<button class="chip' + (uf === f[0] ? ' on' : '') + '" data-uf="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '<span class="note" id="cnt"></span></div><div class="tbl" id="ut"><div class="note" style="padding:14px">불러오는 중…</div></div>';
  var run = function(){ uq = $('#q').value.trim(); $('#ut').innerHTML = '<div class="note" style="padding:14px">불러오는 중…</div>';
    api('users', { q: uq, filter: uf }).then(function(r){ users = r.users; $('#cnt').textContent = '총 ' + r.total + '명' + (r.total > 500 ? ' (앞 500명 표시)' : '');
      $('#ut').innerHTML = users.length ? '<table><thead><tr><th>이름</th><th>로그인</th><th>이메일</th><th>가계부</th><th>상태</th><th>가입</th><th>최근 로그인</th></tr></thead><tbody>' + users.map(function(u){
        return '<tr data-u="' + u.id + '"><td><b>' + esc(u.name || '-') + '</b>' + (u.admin ? ' <span class="pill p-adm">관리자</span>' : '') + '</td><td>' + (PROV[u.provider] || u.provider) + '</td><td>' + esc(u.email && !/\.invalid$/.test(u.email) ? u.email : '-') + '</td><td>' + (u.household ? esc(u.household.name) + (u.household.owner ? ' 👑' : '') : '-') + '</td><td>' + planPill(u) + '</td><td>' + d8(u.created_at) + '</td><td>' + dt(u.last_sign_in_at) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<div class="note" style="padding:14px">해당하는 회원이 없어요.</div>';
      document.querySelectorAll('[data-u]').forEach(function(tr){ tr.onclick = function(){ openUser(tr.dataset.u); }; });
    }).catch(fail); };
  $('#go').onclick = run; $('#q').onkeydown = function(e){ if (e.key === 'Enter') run(); };
  document.querySelectorAll('[data-uf]').forEach(function(b){ b.onclick = function(){ uf = b.dataset.uf; document.querySelectorAll('[data-uf]').forEach(function(x){ x.classList.toggle('on', x === b); }); run(); }; });
  run();
}
function openUser(id){
  var bg = document.createElement('div'); bg.className = 'drawer-bg'; bg.innerHTML = '<div class="drawer"><div class="note">불러오는 중…</div></div>'; document.body.appendChild(bg);
  bg.onclick = function(e){ if (e.target === bg) bg.remove(); };
  var draw = function(){ api('user', { id: id }).then(function(r){
    var u = r.user, s = r.stats || {}, banned = u.banned_until && Date.parse(u.banned_until) > Date.now();
    bg.firstChild.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center"><h3>' + esc(u.name || '이름 없음') + ' ' + planPill(u) + '</h3><button class="btn" id="dx">닫기</button></div>' +
      '<div class="card"><div class="kv"><span>로그인 방법</span><b>' + (PROV[u.provider] || u.provider) + '</b></div><div class="kv"><span>이메일</span><b>' + esc(u.email && !/\.invalid$/.test(u.email) ? u.email : '-') + '</b></div><div class="kv"><span>가입</span><b>' + dt(u.created_at) + '</b></div><div class="kv"><span>최근 로그인</span><b>' + dt(u.last_sign_in_at) + '</b></div><div class="kv"><span>회원 번호</span><span class="note">' + u.id + '</span></div></div>' +
      (u.household ? '<div class="card"><h2>가계부 · ' + esc(u.household.name) + '</h2><div class="kv"><span>역할</span><b>' + ({ owner: '주인', adult: '어른', child: '자녀' }[u.role] || u.role) + '</b></div><div class="kv"><span>요금</span><b>' + (u.plan === 'paid' ? '유료 (' + (u.sub.period === 'comp' ? '관리자 지급' : u.sub.period === 'year' ? '연간' : '월간') + ') · ' + d8(u.sub.expires_at) + '까지' : u.plan === 'trial' ? '무료 체험 · ' + d8(u.household.trial_ends_at) + '까지' : '무료') + '</b></div><div class="kv"><span>기록 수</span><b>' + won(s.tx) + '건</b></div><div class="kv"><span>마지막 기록</span><b>' + dt(s.last_record) + '</b></div><div class="kv"><span>위시 · 알림 기기</span><b>' + s.wishes + ' · ' + s.devices + '</b></div>' +
        '<h2 style="margin-top:12px">가족 (' + r.family.length + ')</h2>' + r.family.map(function(f){ return '<div class="kv"><span>' + esc(f.name) + '</span><span class="note">' + ({ owner: '주인', adult: '어른', child: '자녀' }[f.role] || f.role) + (f.joined ? '' : ' · 초대 대기') + '</span></div>'; }).join('') + '</div>' : '<div class="card note">아직 가계부를 만들지 않았어요.</div>') +
      '<div class="card"><h2>관리</h2><div class="acts">' +
        (u.household ? '<button class="btn" data-a="grant1">플러스 1개월 지급</button><button class="btn" data-a="grant12">플러스 12개월 지급</button><button class="btn" data-a="trial7">체험 7일 연장</button><button class="btn" data-a="trial30">체험 30일 연장</button>' + (u.plan === 'paid' && u.sub && u.sub.source === 'admin' ? '<button class="btn" data-a="revoke">지급한 플러스 회수</button>' : '') : '') +
        (banned ? '<button class="btn" data-a="unban">정지 해제</button>' : '<button class="btn danger" data-a="ban">이용 정지</button>') + '<button class="btn danger" data-a="del">강제 탈퇴</button></div><div id="cf"></div>' +
        '<div class="note" style="margin-top:8px">구글 플레이로 결제한 구독의 환불·해지는 플레이 콘솔 → 주문 관리에서 해요.</div></div>' +
      (r.feedback.length ? '<div class="card"><h2>보낸 의견</h2>' + r.feedback.map(function(f){ return '<div class="fb"><div class="m"><span class="pill p-trial">' + esc(f.kind) + '</span>' + dt(f.created_at) + ' · ' + esc(f.status) + '</div><div class="b">' + esc(f.body) + '</div></div>'; }).join('') + '</div>' : '') +
      (r.log.length ? '<div class="card"><h2>이 회원 관리 기록</h2>' + r.log.map(function(l){ return '<div class="kv"><span>' + esc(l.action) + '</span><span class="note">' + dt(l.at) + ' · ' + esc(l.admin_email) + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="note" style="margin-top:10px">개인정보 보호를 위해 가계부 내용(금액·내역)은 보이지 않아요.</div>';
    bg.querySelector('#dx').onclick = function(){ bg.remove(); };
    var act = function(name, body, ok){ return api(name, Object.assign({ id: id }, body || {})).then(function(){ toast(ok); draw(); if (users.length) usersView(); }).catch(function(e){ toast(e.message); }); };
    bg.querySelectorAll('[data-a]').forEach(function(b){ b.onclick = function(){
      var a = b.dataset.a, cf = bg.querySelector('#cf');
      if (a === 'grant1') return act('grantPlus', { months: 1 }, '플러스 1개월을 지급했어요');
      if (a === 'grant12') return act('grantPlus', { months: 12 }, '플러스 12개월을 지급했어요');
      if (a === 'trial7') return act('extendTrial', { days: 7 }, '체험을 7일 늘렸어요');
      if (a === 'trial30') return act('extendTrial', { days: 30 }, '체험을 30일 늘렸어요');
      if (a === 'revoke') return act('revokePlus', {}, '지급한 플러스를 회수했어요');
      if (a === 'unban') return act('unban', {}, '정지를 풀었어요');
      if (a === 'ban') { cf.innerHTML = '<div class="confirm"><b>이용 정지</b><div class="note">로그인할 수 없게 돼요. 데이터는 그대로 남아요.</div><input class="inp" id="why" placeholder="사유 (기록용)" style="width:100%;margin-top:8px"><button class="btn danger" id="cfgo" style="margin-top:8px">정지하기</button></div>'; bg.querySelector('#cfgo').onclick = function(){ act('ban', { reason: bg.querySelector('#why').value }, '이용을 정지했어요'); }; return; }
      if (a === 'del') { cf.innerHTML = '<div class="confirm"><b>강제 탈퇴</b><div class="note">계정이 지워지고 되돌릴 수 없어요. 가계부 주인이고 다른 어른 가족이 없으면 가계부 전체가 지워져요. 확인하려면 <b>탈퇴</b>라고 적어 주세요.</div><input class="inp" id="why" placeholder="사유 (기록용)" style="width:100%;margin-top:8px"><input class="inp" id="ok" placeholder="탈퇴" style="width:100%;margin-top:6px"><button class="btn danger" id="cfgo" style="margin-top:8px">탈퇴 처리</button></div>';
        bg.querySelector('#cfgo').onclick = function(){ if (bg.querySelector('#ok').value.trim() !== '탈퇴') return toast('“탈퇴”라고 적어 주세요'); api('delete', { id: id, confirm: '탈퇴', reason: bg.querySelector('#why').value }).then(function(){ toast('탈퇴 처리했어요'); bg.remove(); usersView(); }).catch(function(e){ toast(e.message); }); }; }
    }; });
  }).catch(function(e){ if (e.login) { bg.remove(); return loginView('다시 로그인해 주세요.'); } bg.firstChild.innerHTML = '<div class="card">불러오지 못했어요: ' + esc(e.message) + '</div>'; }); };
  draw();
}
function fbView(){
  rpc('admin_feedback', { p_status: fbF === '전체' ? null : fbF }).then(function(fb){
    fb = fb || [];
    $('#view').innerHTML = '<div class="toolbar">' + ['새 의견', '확인함', '반영 예정', '반영 완료', '보류', '전체'].map(function(x){ return '<button class="chip' + (x === fbF ? ' on' : '') + '" data-f="' + x + '">' + x + '</button>'; }).join('') + '</div><div class="card">' +
      (fb.length ? fb.map(function(f){ return '<div class="fb"><div class="m"><span class="pill p-trial">' + esc(f.kind) + '</span><span>' + dt(f.created_at) + '</span>' + (f.app_ver ? '<span>' + esc(f.app_ver) + '</span>' : '') + (f.contact ? '<span>📮 ' + esc(f.contact) + '</span>' : '') +
        '<select data-id="' + f.id + '">' + ['새 의견', '확인함', '반영 예정', '반영 완료', '보류'].map(function(x){ return '<option' + (x === f.status ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div><div class="b">' + esc(f.body) + '</div></div>'; }).join('') : '<div class="note">해당하는 의견이 없어요.</div>') +
      '<div class="note" style="margin-top:8px">예전 버전(가족 비밀번호)에서 보낸 의견은 구글 시트 “의견” 탭에 쌓여요.</div></div>';
    document.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ fbF = b.dataset.f; fbView(); }; });
    document.querySelectorAll('select[data-id]').forEach(function(sel){ sel.onchange = function(){ rpc('admin_set_feedback', { p_id: sel.dataset.id, p_status: sel.value }).then(function(){ toast('상태를 바꿨어요'); }).catch(function(e){ toast(e.message); }); }; });
  }).catch(fail);
}
function logView(){
  api('audit').then(function(r){
    $('#view').innerHTML = '<div class="tbl">' + (r.log.length ? '<table><thead><tr><th>시각</th><th>관리자</th><th>작업</th><th>대상 회원</th><th>내용</th></tr></thead><tbody>' + r.log.map(function(l){ return '<tr data-u="' + esc(l.target) + '"><td>' + dt(l.at) + '</td><td>' + esc(l.admin_email) + '</td><td><b>' + esc(l.action) + '</b></td><td class="note">' + esc(String(l.target || '').slice(0, 8)) + '…</td><td class="note">' + esc(l.detail ? JSON.stringify(l.detail) : '') + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="note" style="padding:14px">아직 관리 기록이 없어요.</div>') + '</div>';
    document.querySelectorAll('[data-u]').forEach(function(tr){ tr.onclick = function(){ openUser(tr.dataset.u); }; });
  }).catch(fail);
}
function boot(){
  if (!getS()) return loginView();
  rpc('am_i_admin').then(function(ok){ if (ok === true) shell(); else { setS(null); loginView('이 이메일은 관리자로 등록되어 있지 않아요.'); } }).catch(function(e){ loginView(e.login ? '' : e.message); });
}
boot();
</script></body></html>
