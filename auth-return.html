<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>툭장부 로그인</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#F6F7FA;--ink:#1B1E26;--ink2:#5A6070;--pri:#2F4B7C}
@media (prefers-color-scheme:dark){:root{--bg:#121419;--ink:#ECEEF3;--ink2:#A9AFBC;--pri:#9DB8EA}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:0 20px;box-sizing:border-box;text-align:center}
.box{max-width:360px;width:100%}
h1{font-size:21px;margin:16px 0 6px}p{color:var(--ink2);font-size:15px;line-height:1.6;margin:0 0 22px}
a.btn{display:block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:16px;border-radius:14px}
a.sub{display:inline-block;margin-top:16px;color:var(--ink2);font-size:14px}
.mark{width:64px;height:64px;border-radius:18px;background:#2F4B7C;display:inline-grid;place-items:center;color:#FFF8EF;font-weight:900;font-size:28px}
</style></head><body><div class="box" id="b"></div>
<script>
// 카카오·네이버·구글·메일 로그인이 끝나면 이 페이지로 와요. 토큰을 앱(툭장부)으로 넘겨줘요.
(function () {
  var h = location.hash.replace(/^#/, ''), app = 'https://oddman-kr.github.io/tukjangbu/v2/';
  var err = /(?:^|&)error_description=([^&]+)/.exec(h);
  var ok = /(?:^|&)access_token=/.test(h);
  var intent = 'intent://auth-callback?' + h + '#Intent;scheme=tukjangbu;package=kr.oddman.tukjangbu;end';
  var b = document.getElementById('b');
  if (!ok && !err) { location.replace(app); return; }
  b.innerHTML = '<div class="mark">툭</div><h1>' + (ok ? '로그인됐어요' : '로그인하지 못했어요') + '</h1>' +
    '<p>' + (ok ? '아래 버튼을 눌러 툭장부 앱으로 돌아가세요.' : decodeURIComponent(err[1].replace(/\+/g, ' '))) + '</p>' +
    '<a class="btn" id="go" href="' + intent + '">툭장부 앱으로 돌아가기</a>' +
    (ok ? '<a class="sub" href="' + app + '#' + h + '">앱이 없으면 웹에서 계속하기</a>' : '');
  // 크롬이 허락하면 바로 앱으로 넘어가요 (막히면 위 버튼을 누르면 돼요)
  if (/Android/i.test(navigator.userAgent)) setTimeout(function () { location.href = intent; }, 150);
  else location.replace(app + '#' + h);
})();
</script></body></html>
